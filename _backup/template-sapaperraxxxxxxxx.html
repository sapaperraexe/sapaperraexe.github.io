<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapaperra Master Blueprint — Ultra Fusion</title>
    <!-- Cargamos Lucide para iconos genéricos rápidos -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* --- DESIGN TOKENS (HSL DRIVEN) --- */
        :root {
            --primary-h: 240; --primary-s: 45%; --primary-l: 69%;
            --ui-primary: hsl(var(--primary-h), var(--primary-s), var(--primary-l));
            --ui-primary-muted: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.2);
            
            /* Paleta Base Sapaperra */
            --bg: #0d0d0d;
            --surface: #161616;
            --surface-2: #222222;
            --text: #e0e0e0;
            --text-muted: #888888;
            --border: rgba(255, 255, 255, 0.08);
            --accent-medieval: #978a4b;

            /* Assets: Checkerboards Base64 */
            --checker-dark: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjIwIiBoZWlnaHQ9IjIwIiBmaWxsPSIjMjIyIi8+PHJlY3Qgd2lkdGg9IjEwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjMzMzIi8+PHJlY3QgeD0iMTAiIHk9IjEwIiB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIGZpbGw9IiMzMzMiLz48L3N2Zz4=');
            --checker-light: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjIwIiBoZWlnaHQ9IjIwIiBmaWxsPSIjZGRkIi8+PHJlY3Qgd2lkdGg9IjEwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjY2NjIi8+PHJlY3QgeD0iMTAiIHk9IjEwIiB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIGZpbGw9IiNjY2MiLz48L3N2Zz4=');

            /* Estética Continuum/Sapaperra */
            --ui-glass: blur(14px) saturate(160%);
            --ui-bevel: inset 0 1px 1px rgba(255,255,255,0.1), inset 0 -1px 1px rgba(0,0,0,0.4);
            --ui-shadow: 0 12px 24px rgba(0,0,0,0.5);
            --transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        [data-theme="light"] {
            --bg: #f2f2f7; --surface: #ffffff; --surface-2: #e5e5ea;
            --text: #1c1c1e; --text-muted: #8e8e93;
            --border: rgba(0, 0, 0, 0.08);
            --ui-bevel: inset 0 1px 1px rgba(255,255,255,0.8), inset 0 -1px 1px rgba(0,0,0,0.05);
            --primary-l: 55%;
        }

        /* --- BASE LAYOUT --- */
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh; margin: 0; display: grid;
            grid-template-columns: 320px 1fr 320px;
            grid-template-rows: 64px 1fr;
            overflow: hidden;
        }

        header {
            grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--surface);
            backdrop-filter: var(--ui-glass); z-index: 1000;
        }
        .logo-box { font-weight: 900; letter-spacing: 5px; color: var(--ui-primary); text-transform: uppercase; font-size: 0.9rem; }

        /* --- SIDEBARS: MODULAR PANELS --- */
        aside {
            background: var(--surface); border-right: 1px solid var(--border);
            overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 28px;
            z-index: 900;
        }
        aside.right { border-right: none; border-left: 1px solid var(--border); }

        .section-label { 
            font-size: 10px; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 2px; color: var(--accent-medieval); margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        /* --- UI COMPONENTS: ADVANCED COLORS --- */
        .color-setup-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .swatch-box { 
            aspect-ratio: 1; border-radius: 6px; cursor: pointer; border: 1px solid var(--border);
            box-shadow: var(--ui-bevel); transition: var(--transition);
            position: relative;
        }
        .swatch-box:hover { transform: scale(1.1) translateY(-2px); z-index: 10; border-color: white; }
        .swatch-box.active { border-color: var(--ui-primary); box-shadow: 0 0 15px var(--ui-primary); }

        .rollout-panel {
            background: var(--surface-2); padding: 12px; border-radius: 8px;
            border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px;
        }

        /* --- BUTTONS CONTINUUM STYLE --- */
        .ui-btn {
            background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
            padding: 10px 18px; border-radius: 4px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
            transition: var(--transition); box-shadow: var(--ui-bevel);
            letter-spacing: 1px;
        }
        .ui-btn:hover { border-color: var(--ui-primary); color: var(--ui-primary); }
        .ui-btn--primary { background: var(--ui-primary); border: none; color: #000; }
        .ui-btn--pill { border-radius: 50px; }

        /* --- THE VIEWPORT: DOTTED MESA --- */
        main {
            position: relative; background-color: var(--bg);
            background-image: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);
            background-size: 32px 32px;
            display: flex; align-items: center; justify-content: center;
        }

        /* WORKSPACE FRAME (CON CHECKERBOARD) */
        .workspace-frame {
            width: 80%; height: 80%; position: relative;
            background-image: var(--checker-dark);
            border: 1px solid var(--border); box-shadow: 0 50px 100px rgba(0,0,0,0.6);
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            transition: aspect-ratio 0.5s ease;
        }
        [data-theme="light"] .workspace-frame { background-image: var(--checker-light); }

        /* GUIDES CONTINUUM */
        .canvas-guides {
            position: absolute; inset: 0; pointer-events: none;
            display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr;
            opacity: 0; transition: opacity 0.3s;
        }
        .canvas-guides.active { opacity: 0.4; }
        .canvas-guides div { border: 0.5px solid var(--ui-primary); }

        /* HANDLES & MANIPULATION */
        .transform-mock {
            width: 300px; height: 200px; position: absolute;
            background: rgba(255,255,255,0.05); border: 2px solid var(--ui-primary);
            backdrop-filter: blur(4px);
        }
        .handle { position: absolute; width: 10px; height: 10px; background: #fff; border: 1px solid var(--ui-primary); z-index: 5; }
        .h-nw { top:-5px; left:-5px; } .h-ne { top:-5px; right:-5px; }
        .h-sw { bottom:-5px; left:-5px; } .h-se { bottom:-5px; right:-5px; }
        .h-rot { 
            top: -40px; left: 50%; width: 15px; height: 15px; border-radius: 50%; 
            transform: translateX(-50%); background: var(--ui-primary); box-shadow: 0 0 10px var(--ui-primary);
        }

        /* --- THE DOCK: FLOATING SYSTEM --- */
        .floating-dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(22, 22, 22, 0.92); backdrop-filter: var(--ui-glass);
            padding: 10px 20px; border-radius: 50px; display: flex; gap: 16px;
            border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 2000;
        }
        .dock-tool {
            width: 46px; height: 46px; border-radius: 12px; background: rgba(255,255,255,0.02);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: var(--transition); color: var(--text-muted);
        }
        .dock-tool:hover { background: var(--ui-primary-muted); color: var(--ui-primary); transform: translateY(-12px) scale(1.15); }
        .dock-tool.active { color: var(--ui-primary); background: rgba(255,255,255,0.05); }

        /* --- ICON SHELF --- */
        .icon-shelf {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
        }
        .icon-unit {
            aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: 0.2s; color: var(--text-muted);
        }
        .icon-unit:hover { border-color: var(--ui-primary); color: var(--ui-primary); background: var(--ui-primary-muted); }

    </style>
</head>
<body data-theme="dark">

    <!-- HIDDEN ICON REPOSITORY -->
    <div id="icon-repo" style="display:none;">
        <svg id="svg-lib">
            <symbol id="ic-grid" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM3 12h18M12 3v18"/></symbol>
            <symbol id="ic-infinity" viewBox="0 0 24 24"><path d="M18.18,8.13c-1.31,0-2.58,0.58-3.48,1.52L12,12.5l-2.7,2.85c-0.9,0.94-2.17,1.52-3.48,1.52c-2.61,0-4.72-2.11-4.72-4.72 c0-2.61,2.11-4.72,4.72-4.72c1.31,0,2.58,0.58,3.48,1.52l1,1.06L11.5,8.73l-1.01-1.07C9.3,6.48,7.7,5.78,6.03,5.78"/></symbol>
            <symbol id="ic-palette" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.707-.484 2.103-1.206.35-.64.302-1.425-.12-2.027A3 3 0 0 1 15 14h.5a3.5 3.5 0 1 0 0-7H12"/></symbol>
            <symbol id="ic-save" viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/></symbol>
            <symbol id="ic-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
            <symbol id="ic-aspect" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></symbol>
        </svg>
    </div>

    <!-- UI STRUCTURE -->
    <header>
        <div class="logo-box"><ui-icon name="ic-infinity" size="24"></ui-icon> SAPAPERRA ULTRA CORE</div>
        <div style="display:flex; gap:12px;">
            <button class="ui-btn" onclick="toggleAppTheme()"><i data-lucide="sun"></i> MODE</button>
            <button class="ui-btn ui-btn--primary" onclick="triggerExport()"><i data-lucide="download"></i> EXPORT KIT</button>
        </div>
    </header>

    <aside>
        <div class="panel-section">
            <span class="section-label">Style Matrix (HSL Rollout)</span>
            <div class="rollout-panel">
                <input type="range" id="hueRange" min="0" max="360" value="240" style="width:100%;" oninput="applyColor(this.value)">
                <div class="color-setup-grid">
                    <div class="swatch-box" style="background:#8a8ad4;" onclick="applyColor(240, this)"></div>
                    <div class="swatch-box" style="background:#978a4b;" onclick="applyColor(48, this)"></div>
                    <div class="swatch-box" style="background:#00ffcc;" onclick="applyColor(165, this)"></div>
                    <div class="swatch-box" style="background:#ff00ff;" onclick="applyColor(300, this)"></div>
                    <div class="swatch-box swatch-picker">
                        <input type="color" oninput="hexToHSLUpdate(this.value)" style="opacity:0; position:absolute; inset:0; cursor:pointer;">
                        <ui-icon name="ic-palette" size="14" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);"></ui-icon>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel-section">
            <span class="section-label">Complementary Design</span>
            <div id="complementary-card" style="height:64px; border-radius:8px; border:1px dashed var(--border); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:10px; color:var(--text-muted);">H + 180 PREDICITON</div>
        </div>

        <div class="panel-section">
            <span class="section-label">Integrated Library</span>
            <div class="icon-shelf" id="shelfRoot">
                <!-- Se pobla dinamicamente -->
            </div>
        </div>
    </aside>

    <main>
        <!-- Mesa de Trabajo Diferenciada -->
        <div class="workspace-frame ui-shadow" id="canvas">
            <div class="canvas-guides" id="guidesLayer">
                <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
            </div>

            <!-- Transform Object -->
            <div class="transform-mock">
                <div class="handle h-nw"></div><div class="handle h-ne"></div>
                <div class="handle h-sw"></div><div class="handle h-se"></div>
                <div class="handle h-rot"></div>
                <div style="padding:24px; font-size:11px; font-family:monospace; line-height:1.6">
                    <span style="color:var(--ui-primary)">[ID] SCRIPT-OBJ-01</span><br>
                    Handles logic: ACTIVE<br>
                    Ratio lock: OFF
                </div>
            </div>
        </div>
    </main>

    <aside class="right">
        <div class="panel-section">
            <span class="section-label">Grid Configuration</span>
            <div class="rollout-panel" style="flex-direction:row; justify-content:space-between; align-items:center;">
                <span style="font-size:10px; font-weight:800;">Display Guides</span>
                <div class="ui-btn ui-btn--icon" style="border-radius:20px; width:44px; height:24px; position:relative; overflow:hidden;" onclick="toggleCanvasGuides(this)">
                    <div id="pill-circle" style="position:absolute; left:4px; top:4px; width:16px; height:14px; background:var(--text); border-radius:10px; transition:0.3s;"></div>
                </div>
            </div>
        </div>

        <div class="panel-section">
            <span class="section-label">Workspace Utility</span>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <div class="ui-btn" onclick="setAspectRatio('1 / 1')"><ui-icon name="ic-aspect"></ui-icon> 1:1 SQUARE</div>
                <div class="ui-btn" onclick="setAspectRatio('16 / 9')"><ui-icon name="ic-aspect"></ui-icon> 16:9 CINEMA</div>
                <div class="ui-btn" onclick="setAspectRatio('2 / 3')"><ui-icon name="ic-aspect"></ui-icon> 2:3 PORTRAIT</div>
                <input type="text" class="rollout-panel" style="border-radius:4px; font-size:10px; border:none; padding:10px;" placeholder="Custom Aspect (e.g. 21/9)" onchange="setAspectRatio(this.value)">
            </div>
        </div>

        <div class="panel-section">
            <span class="section-label">App Persistence</span>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button class="ui-btn ui-btn--primary" onclick="setChecker(true)">Dark Pattern</button>
                <button class="ui-btn" onclick="setChecker(false)">Light Pattern</button>
            </div>
        </div>
    </aside>

    <nav class="floating-dock ui-bevel">
        <div class="dock-tool"><ui-icon name="ic-grid"></ui-icon></div>
        <div class="dock-tool active"><ui-icon name="ic-infinity"></ui-icon></div>
        <div class="dock-tool"><ui-icon name="ic-aspect"></ui-icon></div>
        <div class="dock-tool"><ui-icon name="ic-save"></ui-icon></div>
        <div style="width:1px; background:var(--border); height:20px;"></div>
        <div class="dock-tool" onclick="toggleAppTheme()"><i data-lucide="moon"></i></div>
    </nav>

    <!-- UI CORE SCRIPT -->
    <script>
        lucide.createIcons();
        const root = document.documentElement;

        // --- ICON SYSTEM ---
        class UIIcon extends HTMLElement {
            connectedCallback() {
                const name = this.getAttribute('name');
                const size = this.getAttribute('size') || '20';
                this.innerHTML = `<svg width="${size}" height="${size}" fill="currentColor"><use href="#${name}"/></svg>`;
            }
        }
        customElements.define('ui-icon', UIIcon);

        const shelfRoot = document.getElementById('shelfRoot');
        const symbols = document.getElementById('svg-lib').querySelectorAll('symbol');
        symbols.forEach(s => {
            const unit = document.createElement('div');
            unit.className = 'icon-unit';
            unit.title = s.id;
            unit.innerHTML = `<ui-icon name="${s.id}" size="22"></ui-icon>`;
            shelfRoot.appendChild(unit);
        });

        // --- COLOR PALETTE ENGINE ---
        function applyColor(h, el = null) {
            root.style.setProperty('--primary-h', h);
            document.getElementById('hueRange').value = h;
            
            // Forecast complement
            const compH = (parseInt(h) + 180) % 360;
            const compCard = document.getElementById('complementary-card');
            compCard.style.backgroundColor = `hsl(${compH}, 50%, 50%)`;
            compCard.style.color = '#fff';
            compCard.innerText = `FORCAST HSL(${compH}, 50, 50)`;

            if(el) {
                document.querySelectorAll('.swatch-box').forEach(b => b.classList.remove('active'));
                el.classList.add('active');
            }
        }

        function hexToHSLUpdate(hex) {
            let r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
            r /= 255; g /= 255; b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b), h, s, l = (max + min) / 2;
            if (max == min) h = s = 0; else {
                let d = max - min; s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                } h /= 6;
            } applyColor(Math.round(h*360));
        }

        // --- ASPECT & GUIDES ---
        function setAspectRatio(r) { document.getElementById('canvas').style.aspectRatio = r; }

        function toggleCanvasGuides(btn) {
            const layer = document.getElementById('guidesLayer');
            const pill = document.getElementById('pill-circle');
            const isActive = layer.classList.toggle('active');
            pill.style.left = isActive ? '24px' : '4px';
            pill.style.background = isActive ? 'var(--ui-primary)' : 'var(--text)';
        }

        function toggleAppTheme() {
            const cur = root.getAttribute('data-theme');
            root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
            lucide.createIcons();
        }

        function setChecker(dark) {
            document.getElementById('canvas').style.backgroundImage = dark ? 'var(--checker-dark)' : 'var(--checker-light)';
        }

        // --- MOTOR DE EXPORTACIÓN ---
        function triggerExport() {
            const h = getComputedStyle(root).getPropertyValue('--primary-h').trim();
            const currentMode = root.getAttribute('data-theme');
            
            const content = `
<!DOCTYPE html>
<html lang="es" data-theme="${currentMode}">
<head>
    <style>
        :root { --h: ${h}; --p: hsl(${h}, 50%, 60%); }
        body { background: #0a0a0b; color: #daddd8; font-family: sans-serif; display: flex; flex-direction:column; align-items: center; justify-content: center; height: 100vh; gap: 20px;}
        .card { background: #161616; padding: 40px; border-radius: 12px; border: 1px solid var(--p); box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        .p-btn { background: var(--p); border:none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; color:#000; }
    </style>
</head>
<body>
    <div class="card">
        <h1>EXPORTED THEME</h1>
        <p>Current System HUE: <strong>${h}°</strong></p>
        <button class="p-btn">Confirm Schema</button>
    </div>
</body>
</html>`;

            const blob = new Blob([content], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Sapaperra_Kit_${h}.html`;
            a.click();
        }

        // Initialize Default Color
        applyColor(240);
    </script>
</body>
</html>
