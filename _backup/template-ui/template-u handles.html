<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master UI Blueprint — Sapaperra Scriptorium</title>
    <!-- Lucide Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            /* Palette Tokens (HSL para manipulación dinámica) */
            --ui-h: 240; --ui-s: 50%; --ui-l: 60%;
            --ui-primary: hsl(var(--ui-h), var(--ui-s), var(--ui-l));
            --ui-accent: #978a4b;
            --ui-bg: #121212;
            --ui-surface: rgba(30, 30, 35, 0.95);
            --ui-text: #daddd8;
            --ui-border: rgba(192, 192, 192, 0.15);
            
            /* Bevel & Glass */
            --ui-glass: blur(12px) saturate(150%);
            --ui-bevel-light: inset 1px 1px 0px rgba(255,255,255,0.15);
            --ui-bevel-dark: inset -1px -1px 0px rgba(0,0,0,0.5);
            
            /* Spacing & Radius */
            --ui-radius-lg: 24px;
            --ui-radius-sm: 4px;
            --ui-transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        [data-theme="light"] {
            --ui-bg: #e0e0e0;
            --ui-surface: rgba(220, 220, 225, 0.9);
            --ui-text: #1a1a1a;
            --ui-border: rgba(0, 0, 0, 0.1);
        }

        /* --- RESET & BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--ui-bg);
            color: var(--ui-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: 60px 1fr;
        }

        /* --- UI UTILITIES --- */
        .ui-bevel { box-shadow: var(--ui-bevel-light), var(--ui-bevel-dark), 0 10px 30px rgba(0,0,0,0.3); }
        .ui-glass { background: var(--ui-surface); backdrop-filter: var(--ui-glass); border: 1px solid var(--ui-border); }

        /* --- HEADER --- */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--ui-border);
            z-index: 100;
        }

        .header-title { font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-size: 0.9rem; color: var(--ui-primary); }

        /* --- SIDEBARS --- */
        aside {
            padding: 20px;
            border-right: 1px solid var(--ui-border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        aside.right { border-right: none; border-left: 1px solid var(--ui-border); }
        h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; margin-bottom: 15px; }

        /* --- COMPONENTS: BUTTONS --- */
        .ui-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--ui-border);
            color: var(--ui-text);
            padding: 10px 18px;
            border-radius: var(--ui-radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            transition: var(--ui-transition);
        }
        .ui-btn--primary { background: var(--ui-primary); border: none; color: white; }
        .ui-btn--pill { border-radius: 50px; }
        .ui-btn:hover { transform: translateY(-2px); border-color: var(--ui-primary); box-shadow: 0 0 15px var(--ui-primary); }
        .ui-btn:active { transform: scale(0.95); }

        /* --- COMPONENTS: INPUTS --- */
        .ui-input-group { display: flex; flex-direction: column; gap: 8px; }
        .ui-input {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--ui-border);
            padding: 10px;
            border-radius: var(--ui-radius-sm);
            color: var(--ui-text);
            outline: none;
        }
        .ui-input:focus { border-color: var(--ui-primary); }

        /* --- COMPONENTS: SLIDERS --- */
        .ui-range {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--ui-border);
            border-radius: 2px;
            outline: none;
        }
        .ui-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--ui-primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--ui-primary);
        }

        /* --- CENTER WORKSPACE (THE CANVAS) --- */
        main {
            position: relative;
            background-image: 
                radial-gradient(circle at 2px 2px, var(--ui-border) 1px, transparent 0);
            background-size: 40px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ui-mock-element {
            width: 200px;
            height: 150px;
            position: relative;
            background: var(--ui-surface);
            border: 1px solid var(--ui-primary);
        }

        /* Transform Handles (Visual Only) */
        .handle { width: 8px; height: 8px; background: white; border: 1px solid var(--ui-primary); position: absolute; }
        .h-nw { top: -4px; left: -4px; } .h-ne { top: -4px; right: -4px; }
        .h-sw { bottom: -4px; left: -4px; } .h-se { bottom: -4px; right: -4px; }
        .h-rot { top: -30px; left: 50%; border-radius: 50%; transform: translateX(-50%); width: 12px; height: 12px; }

        /* --- THE DOCK --- */
        .ui-dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            padding: 8px;
            border-radius: 50px;
            z-index: 1000;
        }
        .ui-dock-item {
            width: 45px; height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--ui-transition);
            cursor: pointer;
            color: var(--ui-text);
        }
        .ui-dock-item:hover { background: var(--ui-primary); color: white; transform: translateY(-5px); }
        .ui-dock-item.active { background: var(--ui-primary); color: white; box-shadow: 0 0 20px var(--ui-primary); }

        /* --- COLOR PICKER WIDGET --- */
        .color-card {
            padding: 15px;
            border-radius: 12px;
            background: rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* --- ANIMATIONS --- */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(var(--ui-h), 100%, 50%, 0.4); }
            100% { box-shadow: 0 0 0 15px rgba(0,0,0,0); }
        }
        .pulse-active { animation: pulse 2s infinite; }

    </style>
</head>
<body data-theme="dark">

    <header class="ui-glass">
        <div class="header-title">Sapaperra Master Blueprint</div>
        <div style="display: flex; gap: 15px;">
            <button class="ui-btn ui-btn--pill" id="theme-toggle">
                <i data-lucide="sun"></i> Theme
            </button>
            <button class="ui-btn ui-btn--primary ui-btn--pill ui-bevel">
                <i data-lucide="save"></i> Export Kit
            </button>
        </div>
    </header>

    <!-- Sidebar Izquierda: Controles de Estilo -->
    <aside class="ui-glass">
        <section>
            <h2>Dynamic Palette</h2>
            <div class="color-card">
                <div class="ui-input-group">
                    <label style="font-size: 0.6rem;">PRIMARY HUE</label>
                    <input type="range" class="ui-range" id="hue-slider" min="0" max="360" value="240">
                </div>
                <div class="ui-input-group">
                    <label style="font-size: 0.6rem;">SATURATION</label>
                    <input type="range" class="ui-range" id="sat-slider" min="0" max="100" value="50">
                </div>
            </div>
        </section>

        <section>
            <h2>Boutons & Actions</h2>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="ui-btn ui-bevel">Biselado Standard</button>
                <button class="ui-btn ui-btn--primary ui-bevel">Action Primary</button>
                <button class="ui-btn ui-btn--pill">Pill Shape</button>
                <button class="ui-btn" style="border-style: dashed;">Dashed Action</button>
            </div>
        </section>

        <section>
            <h2>Status Indicators</h2>
            <div style="display: flex; gap: 10px;">
                <span style="width: 12px; height: 12px; border-radius: 50%; background: #4caf50; box-shadow: 0 0 10px #4caf50;"></span>
                <span style="width: 12px; height: 12px; border-radius: 50%; background: #f44336; box-shadow: 0 0 10px #f44336;"></span>
                <span class="pulse-active" style="width: 12px; height: 12px; border-radius: 50%; background: var(--ui-primary);"></span>
            </div>
        </section>
    </aside>

    <!-- Centro: Espacio de Trabajo (Mockup de manipulación) -->
    <main>
        <div class="ui-mock-element ui-bevel">
            <div class="handle h-nw"></div>
            <div class="handle h-ne"></div>
            <div class="handle h-sw"></div>
            <div class="handle h-se"></div>
            <div class="handle h-rot"></div>
            <div style="padding: 20px; font-size: 0.8rem; text-align: center;">
                Transformable Component <br> (Blueprint Only)
            </div>
        </div>
    </main>

    <!-- Sidebar Derecha: Listado de Componentes -->
    <aside class="right ui-glass">
        <section>
            <h2>Input Fields</h2>
            <div class="ui-input-group">
                <input type="text" class="ui-input" placeholder="Scriptorium name...">
                <input type="password" class="ui-input" value="123456">
            </div>
        </section>

        <section>
            <h2>Icon Set (Lucide)</h2>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
                <div class="ui-btn" style="padding: 8px;"><i data-lucide="type"></i></div>
                <div class="ui-btn" style="padding: 8px;"><i data-lucide="image"></i></div>
                <div class="ui-btn" style="padding: 8px;"><i data-lucide="layers"></i></div>
                <div class="ui-btn" style="padding: 8px;"><i data-lucide="mouse-pointer-2"></i></div>
            </div>
        </section>

        <section>
            <h2>Complementary Color</h2>
            <div id="comp-box" style="height: 60px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: bold; color: white;">
                COMPLEMENTARY
            </div>
        </section>
    </aside>

    <!-- El Dock Flotante -->
    <nav class="ui-dock ui-glass ui-bevel">
        <div class="ui-dock-item active"><i data-lucide="layout"></i></div>
        <div class="ui-dock-item"><i data-lucide="pen-tool"></i></div>
        <div class="ui-dock-item"><i data-lucide="grid"></i></div>
        <div class="ui-dock-item"><i data-lucide="settings"></i></div>
    </nav>

    <script>
        // Inicializar Iconos
        lucide.createIcons();

        // 1. Motor de Paleta Dinámica
        const hueSlider = document.getElementById('hue-slider');
        const satSlider = document.getElementById('sat-slider');
        const compBox = document.getElementById('comp-box');
        const root = document.documentElement;

        function updatePalette() {
            const h = hueSlider.value;
            const s = satSlider.value;
            root.style.setProperty('--ui-h', h);
            root.style.setProperty('--ui-s', s + '%');
            
            // Calcular Complementario (H + 180)
            const compH = (parseInt(h) + 180) % 360;
            compBox.style.backgroundColor = `hsl(${compH}, ${s}%, 50%)`;
            compBox.innerText = `COMP: HSL(${compH}, ${s}%, 50%)`;
        }

        hueSlider.addEventListener('input', updatePalette);
        satSlider.addEventListener('input', updatePalette);
        updatePalette();

        // 2. Toggle de Tema
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', () => {
            const body = document.body;
            const isDark = body.getAttribute('data-theme') === 'dark';
            body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeBtn.innerHTML = isDark ? '<i data-lucide="moon"></i> Dark' : '<i data-lucide="sun"></i> Light';
            lucide.createIcons();
        });

        // 3. Dock Interactions
        const dockItems = document.querySelectorAll('.ui-dock-item');
        dockItems.forEach(item => {
            item.addEventListener('click', () => {
                dockItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });

        // 4. Reporte de componentes detectados (Inferencia de IA)
        console.log("Blueprint Loaded: Detectados controles de Continuum, Margoria y Sapaperra.");
    </script>
</body>
</html>
