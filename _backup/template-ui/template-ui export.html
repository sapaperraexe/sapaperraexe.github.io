<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master UI Blueprint — Sapaperra Scriptorium</title>
    <style>
        /* --- DESIGN TOKENS (CSS VARIABLES) --- */
        :root {
            --primary-h: 240; --primary-s: 50%; --primary-l: 60%;
            --accent: hsl(var(--primary-h), var(--primary-s), var(--primary-l));
            --accent-glow: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.3);
            
            /* Sapaperra Dark Palette */
            --bg: #0a0a0a;
            --surface: #161616;
            --surface-hover: #1e1e1e;
            --text: #daddd8;
            --text-muted: #888;
            --border: rgba(192, 192, 192, 0.15);
            
            /* Checkerboard Patterns (Embedded Assets) */
            --checker-dark: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjIwIiBoZWlnaHQ9IjIwIiBmaWxsPSIjMjIyIi8+PHJlY3Qgd2lkdGg9IjEwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjMzMzIi8+PHJlY3QgeD0iMTAiIHk9IjEwIiB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIGZpbGw9IiMzMzMiLz48L3N2Zz4=');
            --checker-light: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjIwIiBmaWxsPSIjZGRkIi8+PHJlY3Qgd2lkdGg9IjEwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjY2NjIi8+PHJlY3QgeD0iMTAiIHk9IjEwIiB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIGZpbGw9IiNjY2MiLz48L3N2Zz4=');

            --glass: blur(12px) saturate(160%);
            --bevel: inset 1px 1px 0px rgba(255,255,255,0.1), inset -1px -1px 0px rgba(0,0,0,0.5);
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        [data-theme="light"] {
            --bg: #e0e0e0;
            --surface: #ffffff;
            --surface-hover: #f0f0f0;
            --text: #1a1a1a;
            --border: rgba(0, 0, 0, 0.1);
        }

        /* --- BASE LAYOUT --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: grid;
            grid-template-columns: 320px 1fr 320px;
            grid-template-rows: 64px 1fr;
            overflow: hidden;
        }

        /* --- HEADER --- */
        header {
            grid-column: 1 / -1;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; z-index: 100;
            backdrop-filter: var(--glass);
        }

        .header-logo { font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }

        /* --- SIDEBARS & PANELS --- */
        aside {
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 30px;
        }
        aside.right { border-right: none; border-left: 1px solid var(--border); }

        .section-title {
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 2px; color: var(--text-muted); margin-bottom: 15px;
            display: flex; align-items: center; gap: 8px;
        }

        /* --- UI COMPONENTS: BUTTONS --- */
        .ui-btn {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 12px; font-weight: 600;
            transition: var(--transition);
            box-shadow: var(--bevel);
            text-transform: uppercase;
        }
        .ui-btn:hover { border-color: var(--accent); background: var(--accent-glow); transform: translateY(-1px); }
        .ui-btn.active { background: var(--accent); color: white; }
        .ui-btn--primary { background: var(--accent); color: white; border: none; }

        /* --- COLOR SYSTEM (SWATCHES) --- */
        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .color-swatch {
            width: 100%; aspect-ratio: 1; border-radius: 4px;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
            transition: var(--transition);
        }
        .color-swatch:hover { transform: scale(1.1); z-index: 2; }
        .color-swatch.picker { position: relative; background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); }
        .color-swatch.picker input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        /* --- TABS SYSTEM --- */
        .ui-tabs { display: flex; background: rgba(0,0,0,0.2); border-radius: 8px; padding: 4px; gap: 4px; }
        .ui-tab {
            flex: 1; padding: 8px; text-align: center; font-size: 11px;
            border-radius: 6px; cursor: pointer; transition: var(--transition);
            font-weight: 700; color: var(--text-muted);
        }
        .ui-tab.active { background: var(--surface); color: var(--accent); box-shadow: var(--bevel); }

        /* --- MAIN CANVAS AREA --- */
        main {
            position: relative;
            background-image: radial-gradient(circle at 2px 2px, var(--border) 1px, transparent 0);
            background-size: 40px 40px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        .workspace-container {
            width: 80%; height: 80%;
            background-image: var(--checker-dark);
            border: 1px solid var(--border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            position: relative;
            display: flex; align-items: center; justify-content: center;
            transition: aspect-ratio 0.5s ease;
        }
        [data-theme="light"] .workspace-container { background-image: var(--checker-light); }

        /* --- ASPECT RATIO & GUIDES --- */
        .guides-overlay {
            position: absolute; inset: 0; pointer-events: none;
            border: 2px dashed var(--accent); opacity: 0.5; display: none;
        }
        .guides-overlay.active { display: block; }

        /* --- DROPDOWNS & RATIO ITEMS --- */
        .ratio-list { display: flex; flex-direction: column; gap: 4px; }
        .ratio-item {
            padding: 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: var(--transition);
        }
        .ratio-item:hover { background: var(--surface-hover); color: var(--accent); }
        .ratio-icon { border: 1px solid currentColor; opacity: 0.6; }

        /* --- DOCK SAPAPERRA --- */
        .ui-dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(22, 22, 22, 0.8); backdrop-filter: var(--glass);
            border-radius: 40px; padding: 10px 20px; display: flex; gap: 15px;
            border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            z-index: 1000;
        }
        .ui-dock-btn {
            width: 42px; height: 42px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition); color: var(--text);
        }
        .ui-dock-btn:hover { background: var(--accent); color: white; transform: scale(1.2) translateY(-10px); }

        /* --- ICON GRID (INSPECTOR) --- */
        .icon-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 10px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px;
        }
        .icon-box {
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
            transition: var(--transition);
        }
        .icon-box:hover { border-color: var(--accent); background: var(--accent-glow); }

    </style>
</head>
<body>

    <!-- SVG SPRITE LIBRARY (HIDDEN) -->
    <svg style="display:none;">
        <symbol id="icon-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></symbol>
        <symbol id="icon-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.707-.484 2.103-1.206.35-.64.302-1.425-.12-2.027A3 3 0 0 1 15 14h.5a3.5 3.5 0 1 0 0-7H12"/></symbol>
        <symbol id="icon-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></symbol>
        <symbol id="icon-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m2.2 12.91 8.97 4.07a2 2 0 0 0 1.66 0l8.97-4.07"/><path d="m2.2 17.91 8.97 4.07a2 2 0 0 0 1.66 0l8.97-4.07"/></symbol>
        <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
        <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
    </svg>

    <header>
        <div class="header-logo">Sapaperra Master</div>
        <div style="display: flex; gap: 12px;">
            <button class="ui-btn" onclick="toggleTheme()">
                <svg width="16" height="16"><use href="#icon-sun"/></svg> Mode
            </button>
            <button class="ui-btn ui-btn--primary" onclick="exportKit()">
                <svg width="16" height="16"><use href="#icon-save"/></svg> Export Kit
            </button>
        </div>
    </header>

    <aside>
        <section>
            <div class="section-title">Dynamic Palette</div>
            <div class="color-grid">
                <div class="color-swatch" style="background:#8a8ad4" onclick="setPalette(240, 50, 60)"></div>
                <div class="color-swatch" style="background:#978a4b" onclick="setPalette(48, 35, 45)"></div>
                <div class="color-swatch" style="background:#850d00" onclick="setPalette(6, 100, 26)"></div>
                <div class="color-swatch" style="background:#00ffcc" onclick="setPalette(168, 100, 50)"></div>
                <div class="color-swatch picker">
                    <input type="color" oninput="setPaletteFromHex(this.value)">
                </div>
            </div>
        </section>

        <section>
            <div class="section-title">Navigation Tabs</div>
            <div class="ui-tabs">
                <div class="ui-tab active">Assets</div>
                <div class="ui-tab">Layers</div>
                <div class="ui-tab">Settings</div>
            </div>
        </section>

        <section>
            <div class="section-title">Embedded Icon Library</div>
            <div class="icon-grid" id="iconLibrary">
                <!-- Generado por JS -->
            </div>
        </section>
    </aside>

    <main id="capture-area">
        <div class="workspace-container" id="workspace">
            <div class="guides-overlay" id="guides"></div>
            <div style="text-align: center; opacity: 0.5;">
                <svg width="64" height="64"><use href="#icon-layers"/></svg>
                <p style="font-size: 12px; margin-top: 10px; font-weight: 700;">WORKSPACE CANVAS</p>
            </div>
        </div>
    </main>

    <aside class="right">
        <section>
            <div class="section-title">Grid & Inspector</div>
            <div class="ratio-list">
                <div class="ratio-item" onclick="toggleGuides()">
                    <span id="txtGuideStatus">SHOW GUIDES</span>
                    <svg width="24" height="24" id="guideToggleIcon"><rect x="1" y="5" width="22" height="14" rx="7" ry="7" fill="var(--border)"/><circle cx="8" cy="12" r="3" fill="white"/></svg>
                </div>
                
                <div style="margin: 10px 0; height: 1px; background: var(--border);"></div>
                
                <div class="ratio-item" onclick="setRatio('1 / 1')">1:1 Square <div class="ratio-icon" style="width:12px; height:12px;"></div></div>
                <div class="ratio-item" onclick="setRatio('16 / 9')">16:9 Cinema <div class="ratio-icon" style="width:18px; height:10px;"></div></div>
                <div class="ratio-item" onclick="setRatio('2 / 3')">2:3 Portrait <div class="ratio-icon" style="width:10px; height:15px;"></div></div>
                <input type="text" class="ui-input" placeholder="Custom Ratio (e.g. 21/9)" onchange="setRatio(this.value)" style="font-size: 10px; margin-top: 10px;">
            </div>
        </section>

        <section>
            <div class="section-title">Object Persistence</div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="ui-btn"><svg width="14" height="14"><use href="#icon-lock"/></svg> Lock Elements</button>
                <button class="ui-btn"><svg width="14" height="14"><use href="#icon-eye"/></svg> Visibility Toggle</button>
            </div>
        </section>
    </aside>

    <nav class="ui-dock">
        <div class="ui-dock-btn"><svg width="20" height="20"><use href="#icon-palette"/></svg></div>
        <div class="ui-dock-btn"><svg width="20" height="20"><use href="#icon-grid"/></svg></div>
        <div class="ui-dock-btn" style="background: var(--accent); color: white;"><svg width="20" height="20"><use href="#icon-layers"/></svg></div>
    </nav>

    <script>
        // --- THEME & PALETTE ENGINE ---
        function toggleTheme() {
            const body = document.body;
            const theme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', theme);
        }

        function setPalette(h, s, l) {
            document.documentElement.style.setProperty('--primary-h', h);
            document.documentElement.style.setProperty('--primary-s', s + '%');
            document.documentElement.style.setProperty('--primary-l', l + '%');
        }

        function setPaletteFromHex(hex) {
            // Convert Hex to HSL
            let r = parseInt(hex.slice(1, 3), 16) / 255;
            let g = parseInt(hex.slice(3, 5), 16) / 255;
            let b = parseInt(hex.slice(5, 7), 16) / 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max == min) h = s = 0;
            else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            setPalette(h * 360, s * 100, l * 100);
        }

        // --- GRID & RATIO SYSTEM ---
        let guidesActive = false;
        function toggleGuides() {
            guidesActive = !guidesActive;
            const g = document.getElementById('guides');
            const txt = document.getElementById('txtGuideStatus');
            const icon = document.getElementById('guideToggleIcon');
            
            if(guidesActive) {
                g.classList.add('active');
                txt.innerText = "HIDE GUIDES";
                txt.style.color = "var(--accent)";
                icon.innerHTML = '<rect x="1" y="5" width="22" height="14" rx="7" ry="7" fill="var(--accent)"/><circle cx="16" cy="12" r="3" fill="white"/>';
            } else {
                g.classList.remove('active');
                txt.innerText = "SHOW GUIDES";
                txt.style.color = "inherit";
                icon.innerHTML = '<rect x="1" y="5" width="22" height="14" rx="7" ry="7" fill="var(--border)"/><circle cx="8" cy="12" r="3" fill="white"/>';
            }
        }

        function setRatio(val) {
            document.getElementById('workspace').style.aspectRatio = val;
        }

        // --- ICON LIBRARY POPULATOR ---
        const icons = ['grid', 'palette', 'save', 'sun', 'layers', 'lock', 'eye'];
        const lib = document.getElementById('iconLibrary');
        icons.forEach(icon => {
            const box = document.createElement('div');
            box.className = 'icon-box';
            box.innerHTML = `<svg width="20" height="20"><use href="#icon-${icon}"/></svg>`;
            lib.appendChild(box);
        });

        // --- EXPORT KIT ENGINE ---
        function exportKit() {
            const cssVars = document.documentElement.style.cssText;
            const currentTheme = document.body.getAttribute('data-theme');
            const htmlContent = document.body.innerHTML;

            const template = `
<!DOCTYPE html>
<html lang="es" data-theme="${currentTheme}">
<head>
    <meta charset="UTF-8">
    <title>Exported Sapaperra Kit</title>
    <style>
        :root { ${cssVars} }
        ${document.querySelector('style').innerHTML}
    </style>
</head>
<body data-theme="${currentTheme}">
    ${htmlContent}
</body>
</html>`;

            const blob = new Blob([template], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'sapaperra-master-kit.html';
            link.click();
        }
    </script>
</body>
</html>
