<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master UI Blueprint — Sapaperra Scriptorium Core</title>
    <style>
        /* --- DESIGN TOKENS (HSL DRIVEN) --- */
        :root {
            --primary-h: 240; --primary-s: 45%; --primary-l: 69%;
            --ui-primary: hsl(var(--primary-h), var(--primary-s), var(--primary-l));
            --ui-primary-muted: hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.2);
            
            --bg: #0d0d0d;
            --surface: #161616;
            --surface-2: #222222;
            --text: #e0e0e0;
            --text-muted: #888888;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #978a4b;

            --ui-radius-lg: 24px;
            --ui-radius-md: 10px;
            --ui-radius-sm: 4px;

            --ui-glass: blur(14px) saturate(160%);
            --ui-bevel: inset 0 1px 1px rgba(255,255,255,0.1), inset 0 -1px 1px rgba(0,0,0,0.4);
            --ui-shadow-md: 0 12px 24px rgba(0,0,0,0.5);
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            
            /* Backgrounds Pattern Base */
            --grid-main: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);
        }

        [data-theme="light"] {
            --bg: #f2f2f7; --surface: #ffffff; --surface-2: #e5e5ea;
            --text: #1c1c1e; --text-muted: #8e8e93;
            --border: rgba(0, 0, 0, 0.08);
            --ui-bevel: inset 0 1px 1px rgba(255,255,255,0.8), inset 0 -1px 1px rgba(0,0,0,0.05);
            --primary-l: 55%;
        }

        /* --- TRANSPARENCY PATTERNS --- */
        .checker-dark {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjIwIiBoZWlnaHQ9IjIwIiBmaWxsPSIjMjIyIi8+PHJlY3Qgd2lkdGg9IjEwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjMzMzIi8+PHJlY3QgeD0iMTAiIHk9IjEwIiB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIGZpbGw9IiMzMzMiLz48L3N2Zz4=');
        }
        .checker-light {
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PHJlY3Qgd2lkdGg9IjIwIiBmaWxsPSIjZGRkIi8+PHJlY3Qgd2lkdGg9IjEwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjY2NjIi8+PHJlY3QgeD0iMTAiIHk9IjEwIiB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIGZpbGw9IiNjY2MiLz48L3N2Zz4=');
        }

        /* --- LAYOUT STRUCTURE --- */
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg); color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh; margin: 0; display: grid;
            grid-template-columns: 320px 1fr 320px;
            grid-template-rows: 64px 1fr;
            overflow: hidden;
        }

        header {
            grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--surface);
            backdrop-filter: var(--ui-glass); z-index: 100;
        }

        aside {
            background: var(--surface); border-right: 1px solid var(--border);
            overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 32px;
            z-index: 90;
        }

        aside.right { border-right: none; border-left: 1px solid var(--border); }

        main {
            position: relative; overflow: auto; background-image: var(--grid-main);
            background-size: 32px 32px; display: flex; align-items: center; justify-content: center;
        }

        /* --- WORKSPACE COMPONENTS --- */
        .workspace-frame {
            width: 500px; height: 350px; background-size: 20px 20px;
            position: relative; box-shadow: var(--ui-shadow-md); border: 1px solid var(--primary-muted);
        }

        .handle { 
            position: absolute; width: 10px; height: 10px; 
            background: #fff; border: 1px solid var(--ui-primary); z-index: 5;
        }
        .h-nw { top: -5px; left: -5px; cursor: nw-resize; }
        .h-ne { top: -5px; right: -5px; cursor: ne-resize; }
        .h-sw { bottom: -5px; left: -5px; cursor: sw-resize; }
        .h-se { bottom: -5px; right: -5px; cursor: se-resize; }
        .h-rot { top: -35px; left: 50%; border-radius: 50%; transform: translateX(-50%); width: 14px; height: 14px; background: var(--ui-primary); border: 2px solid #fff;}

        /* --- UI ELEMENTS (COMPONENTS) --- */
        h2 { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;}
        
        .ui-card { background: var(--surface-2); padding: 16px; border-radius: var(--ui-radius-md); border: 1px solid var(--border); }

        .ui-btn {
            background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
            padding: 10px 16px; border-radius: var(--ui-radius-sm); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 0.75rem; text-transform: uppercase; font-weight: 800;
            transition: var(--ui-transition); box-shadow: var(--ui-bevel);
        }
        .ui-btn--primary { background: var(--ui-primary); border: none; color: #000; }
        .ui-btn--icon { width: 42px; height: 42px; border-radius: 12px; padding: 0; }
        .ui-btn:hover { transform: translateY(-2px); border-color: var(--ui-primary); }

        /* Complex Color Picker Mockup (Realtime Style) */
        .palette-panel { display: grid; gap: 16px; }
        .color-setup-node { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.3); }
        
        .sat-picker { 
            height: 120px; border-radius: 6px; position: relative;
            background: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent);
            background-color: var(--ui-primary); border: 1px solid var(--border);
        }
        .sl-handle { position: absolute; width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; top: 20%; left: 80%; transform: translate(-50%, -50%); }

        .swatch-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .swatch { aspect-ratio: 1; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); transition: 0.2s; }
        .swatch:hover { transform: scale(1.15); z-index: 2; border-color: white; }

        /* Dropdowns Continuum style */
        .dropdown-panel { 
            background: var(--surface-2); border: 1px solid var(--border); 
            border-radius: 12px; padding: 12px; box-shadow: var(--ui-shadow-md);
        }
        .ratio-item { 
            display: flex; align-items: center; justify-content: space-between; padding: 8px;
            border-radius: 6px; cursor: pointer; font-size: 0.75rem; transition: 0.2s;
        }
        .ratio-item:hover { background: rgba(255,255,255,0.05); color: var(--ui-primary); }
        .ratio-icon { width: 16px; height: 12px; border: 1px solid currentColor; opacity: 0.5; }

        /* The Dock Flotante (Sapaperra) */
        .ui-dock {
            position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
            padding: 12px; display: flex; gap: 14px; background: rgba(26,26,26,0.9);
            backdrop-filter: var(--ui-glass); border-radius: 50px; border: 1px solid var(--border);
            z-index: 1000;
        }
        .ui-dock-icon {
            width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
            border-radius: 15px; cursor: pointer; transition: var(--transition);
            background: rgba(255,255,255,0.03); color: var(--text-muted);
        }
        .ui-dock-icon:hover { 
            transform: translateY(-10px) scale(1.2); 
            background: var(--ui-primary-muted); color: var(--ui-primary);
        }
        .ui-dock-icon.active { background: var(--ui-primary-muted); color: var(--ui-primary); box-shadow: 0 0 20px var(--ui-primary-muted); }

        /* Glitch Animation for App Load */
        @keyframes ui-glitch {
            0% { transform: translate(0); clip-path: inset(0 0 0 0); }
            20% { transform: translate(-3px, 3px); }
            40% { clip-path: inset(20% 0 40% 0); transform: translate(3px, -2px); }
            100% { transform: translate(0); }
        }
        .app-glitch-active { animation: ui-glitch 0.3s steps(2); }

        /* Status & Tooltips */
        [data-tooltip]::after {
            content: attr(data-tooltip); position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
            padding: 6px 10px; background: #000; color: #fff; border-radius: 4px; font-size: 10px;
            white-space: nowrap; border: 1px solid var(--border); display: none; pointer-events: none;
        }
        [data-tooltip]:hover::after { display: block; }

        /* Fuente personalizada */
        @font-face {
            font-family: 'OpenSeshat';
            src: url('OpenSeshat.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            /* Sapaperra Dark Scheme (Default) */
            --bg-dark: #1a1a1a;
            --text-dark: #c0c0c0;
            --link-dark: #8a8ad4;
            --link-hover-dark: #b0b0ff;
            --pre-bg-dark: #222;
            --border-light: rgba(192, 192, 192, 0.15);

            /* Sapaperra Light Scheme */
            --bg-light: #e0e0e0;
            --text-light: #2a2a2a;
            --link-light: #4a4a9d;
            --link-hover-light: #00008b;
            --pre-bg-light: #f0f0f0;

            /* Dynamic Variables */
            --bg-color: var(--bg-dark);
            --text-color: var(--text-dark);
            --link-color: var(--link-dark);
            --link-hover: var(--link-hover-dark);
            --pre-bg: var(--pre-bg-dark);
        }

        /* Base Body Styles */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'OpenSeshat', "Courier New", Courier, monospace;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.4;
        }

        /* Light Mode Class */
        body.light-mode {
            --bg-color: var(--bg-light);
            --text-color: var(--text-light);
            --link-color: var(--link-light);
            --link-hover: var(--link-hover-light);
            --pre-bg: var(--pre-bg-light);
        }

        /* Links */
        a {
            color: var(--link-color);
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        /* Theme toggle button shared logic */
        #theme-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            cursor: pointer;
            font-family: monospace;
            user-select: none;
            color: var(--link-color);
            z-index: 100;
            font-size: 1rem;
        }

        /* Shared UI Components */
        pre {
            background: var(--pre-bg);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            border: 1px solid var(--border-light);
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div style="display:flex; align-items:center; gap:16px;">
            <ui-icon name="infinity" size="30" style="color:var(--ui-primary)"></ui-icon>
            <span style="letter-spacing:4px; font-weight:800; font-size:1rem">SCRIPTORA MASTER</span>
        </div>
        <div style="display:flex; gap:12px">
            <button class="ui-btn ui-btn--primary" id="btnExport" data-tooltip="Generate HTML Package">
                <ui-icon name="save"></ui-icon> Export Kit
            </button>
        </div>
    </header>

    <!-- Sidebar Izquierda: Sistema de Paleta e Imagen -->
    <aside>
        <section>
            <h2><ui-icon name="palette" size="14"></ui-icon> APARIENCIA & TEMA</h2>
            <div class="palette-panel ui-card">
                <div class="color-setup-node">
                    <span style="font-size:0.7rem; font-weight:800">Primary Color</span>
                    <input type="range" id="hueRange" min="0" max="360" value="240" style="width:100px">
                    <ui-icon name="lock" size="14"></ui-icon>
                </div>
                
                <div class="sat-picker" id="pickerArea">
                    <div class="sl-handle"></div>
                </div>

                <div class="swatch-group">
                    <div class="swatch" style="background:#00ffcc" onclick="updateTheme(165)"></div>
                    <div class="swatch" style="background:#ff00ff" onclick="updateTheme(300)"></div>
                    <div class="swatch" style="background:#8a8ad4" onclick="updateTheme(240)"></div>
                    <div class="swatch" style="background:#978a4b" onclick="updateTheme(50)"></div>
                    <div class="swatch" style="background:var(--accent)">
                         <input type="color" style="opacity:0; width:100%; height:100%; cursor:pointer" oninput="extractHue(this.value)">
                    </div>
                </div>

                <button class="ui-btn" style="width:100%;" onclick="toggleMode()">
                    <ui-icon name="sun"></ui-icon> Toggle Dark/Light
                </button>
            </div>
        </section>

        <section>
            <h2><ui-icon name="frame" size="14"></ui-icon> GRID & ASPECT RATIO</h2>
            <div class="dropdown-panel">
                <div class="ratio-item" id="guideToggle" onclick="toggleGuides()">
                    <span>HIDE GUIDES</span>
                    <ui-icon name="eye" size="16"></ui-icon>
                </div>
                <div style="margin: 12px 0; height:1px; background:var(--border)"></div>
                <div class="ratio-item">1:1 Square <div class="ratio-icon"></div></div>
                <div class="ratio-item">16:9 Cinema <div class="ratio-icon" style="width:20px; height:11px"></div></div>
                <div class="ratio-item">2:3 Portrait <div class="ratio-icon" style="width:10px; height:15px"></div></div>
                <input type="text" style="width:100%; padding:8px; border-radius:4px; background:rgba(0,0,0,0.2); border:1px solid var(--border); color:white; font-size:10px; margin-top:8px" placeholder="Custom (e.g. 21:9)">
            </div>
        </section>
    </aside>

    <!-- Centro: Espacio Scriptorium con Diferenciación de Fondo -->
    <main>
        <!-- Checkerboard pattern para imagen de contenido -->
        <div class="workspace-frame ui-bevel checker-dark" id="workspace">
            <div class="handle h-nw"></div>
            <div class="handle h-ne"></div>
            <div class="handle h-sw"></div>
            <div class="handle h-se"></div>
            <div class="handle h-rot"></div>
            <div style="padding:20px; font-weight:800; opacity:0.1; font-size:3rem; pointer-events:none">SCN 01</div>
        </div>
    </main>

    <!-- Sidebar Derecha: Biblioteca de Iconos Integrada -->
    <aside class="right">
        <section>
            <h2><ui-icon name="layers" size="14"></ui-icon> ICON CATALOGUE</h2>
            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px;" id="iconShelf">
                <!-- Se inyectan automáticamente desde la librería -->
            </div>
        </section>

        <section>
            <h2><ui-icon name="settings" size="14"></ui-icon> PROCESADO DE METODO</h2>
            <div class="palette-panel ui-card">
                 <div class="ui-btn" data-tooltip="Soft Collage Method"><ui-icon name="method-collage"></ui-icon> Collage</div>
                 <div class="ui-btn" data-tooltip="Frame Extraction"><ui-icon name="method-soft-frame"></ui-icon> Frame</div>
                 <div class="ui-btn" data-tooltip="Recursive Iterations"><ui-icon name="infinity"></ui-icon> Procedural</div>
            </div>
        </section>
    </aside>

    <!-- El Dock Sapaperra (Modular) -->
    <sapaperra-dock playground></sapaperra-dock>

        const ICONS = {

            margoria: '<g transform="scale(0.08) translate(0,-1736)"><path d="M1481.91 1846.84C1491.14 1846.84 1499.27 1867.09 1492.68 1873.67 1491.02 1875.33 1487.87 1875.56 1485.53 1874.19 1484.68 1873.7 1483.69 1871.7 1483.32 1869.74 1482.96 1867.79 1481.63 1863.76 1480.38 1860.79 1476.79 1852.28 1477.39 1846.84 1481.91 1846.84ZM1307.31 1846.41C1308.51 1846.05 1309.6 1846.15 1310.43 1846.84 1313.26 1849.18 1311.35 1862.34 1306.74 1872.32 1305.27 1875.5 1300.45 1876.04 1297.74 1873.32 1295.49 1871.08 1295.08 1864.29 1296.89 1859.02 1299.02 1852.78 1303.69 1847.49 1307.31 1846.41Z"/></g>',

                const name = this.getAttribute('name');
                const size = this.getAttribute('size') || '20';
                const stroke = this.getAttribute('stroke') || '2';
                this.innerHTML = `
                    <svg viewBox="0 0 24 24" width="${size}" height="${size}" 
                         fill="none" stroke="currentColor" stroke-width="${stroke}" 
                         stroke-linecap="round" stroke-linejoin="round">
                        ${ICONS[name] || '<circle cx="12" cy="12" r="10" />'}

        customElements.define('ui-icon', UIIcon);

        const shelf = document.getElementById('iconShelf');
        Object.keys(ICONS).forEach(key => {
            const btn = document.createElement('div');

        const hueRange = document.getElementById('hueRange');
        const root = document.documentElement;

        function updateTheme(h) {
            hueRange.value = h;
            root.style.setProperty('--primary-h', h);
            document.body.classList.add('app-glitch-active');
            setTimeout(() => document.body.classList.remove('app-glitch-active'), 300);
        }

        hueRange.addEventListener('input', (e) => updateTheme(e.target.value));

        function extractHue(hex) {
            let r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
            r/=255, g/=255, b/=255;
            let max = Math.max(r,g,b), min = Math.min(r,g,b);
            let h, d = max - min;
            if(d==0) h = 0;
            else if(max==r) h = ((g-b)/d) % 6;
            else if(max==g) h = (b-r)/d + 2;
            else h = (r-g)/d + 4;
            h = Math.round(h * 60);
            if(h<0) h += 360;
            updateTheme(h);
        }

            const current = document.body.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', target);

            workspace.className = `workspace-frame ui-bevel checker-${target}`;
        }

                            const moduleUrl = item.dataset.url;

                            this.classList.add('app-loaded');

                            items.forEach(i => {
                                i.classList.remove('active');
                                i.classList.remove('pulse-hint');
                            });
                            item.classList.add('active');

                            // Trigger Glitch Animation
                            if (glitchOverlay) {
                                glitchOverlay.classList.remove('active');
                                void glitchOverlay.offsetWidth; // Force reflow
                                glitchOverlay.classList.add('active');

                                    window.dispatchEvent(new CustomEvent('module-change', { 
                                        detail: { 
                                            module: moduleName,
                                            url: moduleUrl
