<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapaperra.exe</title>
    
    <!-- All styles are in-line in this single file -->
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --text-dark: #c0c0c0;
            --link-dark: #8a8ad4;
            --link-hover-dark: #b0b0ff;
            --pre-bg-dark: #222;

            --bg-light: #e0e0e0;
            --text-light: #2a2a2a;
            --link-light: #4a4a9d;
            --link-hover-light: #00008b;
            --pre-bg-light: #f0f0f0;
            
            --bg-color: var(--bg-dark);
            --text-color: var(--text-dark);
            --link-color: var(--link-dark);
            --link-hover: var(--link-hover-dark);
            --pre-bg: var(--pre-bg-dark);
        }

        @font-face {
            font-family: 'OpenSeshat';
            src: url('css/OpenSeshat.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body.light-mode {
            --bg-color: var(--bg-light);
            --text-color: var(--text-light);
            --link-color: var(--link-light);
            --link-hover: var(--link-hover-light);
            --pre-bg: var(--pre-bg-light);
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        #background-poem {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.05;
            color: var(--text-color);
            font-family: monospace;
            overflow: hidden;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: none;
        }

        #main-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        #symbol {
            font-size: 150pt;
            font-weight: bold;
            color: var(--text-color);
            font-family: 'OpenSeshat', 'Times New Roman', 'MS Mincho', 'SimSun', serif;
        }

        #death-phrase {
            margin-top: 1.5rem;
            font-size: 1.2rem;
            font-style: italic;
        }

        #links {
            margin-top: 3rem;
            font-size: 1.1rem;
            line-height: 1.8;
            font-family: 'OpenSeshat', 'Times New Roman', Times, serif;
        }

        #links a {
            color: var(--link-color);
            text-decoration: none;
            transition: color 0.2s;
        }

        #links a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }

        #random-quote-div {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            text-align: center; 
            font-size: 0.85rem;
            z-index: 10;
            background-color: var(--bg-color);
            opacity: 0.95;
            color: var(--text-color);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: background-color 0.3s, color 0.3s;
            box-sizing: border-box;
        }

        .btn-wrapper {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 100;
            display: ruby;
            flex-direction: column;
            align-items: flex-end;
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            width: 40px;
            height: 40px;
        }

        .btn-icon:hover {
            background: var(--pre-bg);
            border-color: var(--link-color);
            color: var(--link-color);
        }

        .tooltip {
            visibility: hidden;
            background-color: var(--text-color);
            color: var(--bg-color);
            text-align: center;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 5px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-wrapper:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        @media (max-width: 600px) {
            #symbol { font-size: 100pt; }
            #random-quote-div { padding: 1rem; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
  <sapaperra-dock></sapaperra-dock>
    <!-- Background element, populated by JS -->
    <div id="background-poem"></div>
	  
	
    <!-- Theme Toggle Button -->
    <div class="btn-wrapper">
        <span class="tooltip">Switch Theme</span>
        <button class="btn-icon" id="theme-toggle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
        </button>
    </div>
    <!-- Main content (Symbol, Phrase, Links) -->
    <div id="main-container">

        <!-- 1. Giant Kanji (堕 - "fallen") -->
        <div id="symbol">墮</div>

        <!-- 2. Death screen phrase, populated by JS -->
        <div id="death-phrase">...initiating arcane process...</div>

        <!-- 3. Links -->
        <div id="links">
            {<b><a href="https://insufribles.tumblr.com/" target="_blank" rel="noopener noreferrer">insufferibilis</a></b>}
             | 
            {<b><a href="https://github.com/sapaperraexe" target="_blank" rel="noopener noreferrer">code</a></b>}
             | 
            {<b><a href="https://johnacevedoilustra.tumblr.com/" target="_blank" rel="noopener noreferrer">visual</a></b>}
             | 
            {<b><a href="https://www.youtube.com/@yonefer" target="_blank" rel="noopener noreferrer">sound</a></b>}
        </div>
        
    </div>
    
    <!-- Div for Random Quotes, aligned center bottom (ADJUSTED ELEMENT) -->
    <div id="random-quote-div">
        <!-- Quote will be injected here by JavaScript -->
    </div>
 <!-- Scripts (Ordered for correct execution) -->
    <script src="sapaperraexe-strings.js"></script>
    <script src="sapaperraexe-dock.js"></script>
</body>

</html>
