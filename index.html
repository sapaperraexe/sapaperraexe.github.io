<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapaperra.exe</title>
    
    <!-- All styles are in-line in this single file -->
    <style>
        :root {
            /* Color scheme inspired by attachments, avoiding pure black/white */
            --bg-dark: #1a1a1a;
            --text-dark: #c0c0c0; /* silver */
            --link-dark: #8a8ad4; /* muted purple/blue */
            --link-hover-dark: #b0b0ff;
            --pre-bg-dark: #222;

            --bg-light: #e0e0e0; /* off-white */
            --text-light: #2a2a2a; /* off-black */
            --link-light: #4a4a9d;
            --link-hover-light: #00008b; /* darkblue */
            --pre-bg-light: #f0f0f0;
            
            /* Default to dark mode */
            --bg-color: var(--bg-dark);
            --text-color: var(--text-dark);
            --link-color: var(--link-dark);
            --link-hover: var(--link-hover-dark);
            --pre-bg: var(--pre-bg-dark);
        }

        /* --- Fuente OpenSeshat --- */
     @font-face {
    font-family: 'OpenSeshat';
    src: url('css/OpenSeshat.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

        /* Light mode class */
        body.light-mode {
            --bg-color: var(--bg-light);
            --text-color: var(--text-light);
            --link-color: var(--link-light);
            --link-hover: var(--link-hover-light);
            --pre-bg: var(--pre-bg-light);
        }

        /* Base styles */
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden; /* Prevent horizontal scroll from poem */
        }

        /* Subtle, random background text inspired by POEM_B.html */
        #background-poem {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.05; /* Very subtle */
            color: var(--text-color);
            font-family: monospace; /* More "techno" */
            overflow: hidden;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: none;
            transition: opacity 0.3s;
        }

        /* Main content container */
        #main-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* The giant central symbol */
        #symbol {
            font-size: 150pt;
            font-weight: bold;
            color: var(--text-color);
            /* Fallback fonts for CJK */
            font-family: 'OpenSeshat', 'Times New Roman', 'MS Mincho', 'SimSun', serif;
        }

        /* The death screen phrase */
        #death-phrase {
            margin-top: 1.5rem;
            font-size: 1.2rem;
            font-style: italic;
        }

        /* Links section */
        #links {
            margin-top: 3rem;
            font-size: 1.1rem;
            line-height: 1.8;
            font-family: 'OpenSeshat', 'Times New Roman', Times, serif;
        }

        #links a {
            color: var(--link-color);
            text-decoration: none;
            transition: color 0.2s;
        }

        #links a:hover {
            color: var(--link-hover);
            text-decoration: underline;
        }
        
        /* Theme toggle button */
        #theme-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            cursor: pointer;
            font-family: monospace;
            user-select: none;
            color: var(--link-color);
            z-index: 100;
            font-size: 1rem;
        }

        /* --- Quote Div Styles (ADJUSTED) --- */
        #random-quote-div {
            position: fixed; /* Lo fija al viewport */
            bottom: 0; /* Lo alinea al fondo */
            left: 0;
            right: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            text-align: center; 
            font-size: 0.85rem;
            z-index: 10;
            
            /* Subtle background and blur */
            background-color: var(--bg-color);
            opacity: 0.95;
            color: var(--text-color);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: background-color 0.3s, color 0.3s, opacity 0.3s;
            box-sizing: border-box;
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            #symbol {
                font-size: 100pt;
            }
            #random-quote-div {
                padding: 1rem;
                font-size: 0.75rem;
            }
        }

    </style>
</head>
<body>

        <div id="symbol">墮</div>

        <!-- 2. Death screen phrase, populated by JS -->
        <div id="death-phrase">...initiating arcane process...</div>

        <!-- 3. Links -->
        <div id="links">

             | 
            {<b><a href="https://www.youtube.com/@yonefer" target="_blank" rel="noopener noreferrer">sound</a></b>}

    </div>

                    fullText += poemLines[randomIndex] + ' '.repeat(Math.floor(Math.random() * 20) + 5);

                const currentTheme = localStorage.getItem('theme');
                if (currentTheme === 'light') {

                    toggle.textContent = '[X]';
                } else {
                    body.classList.remove('light-mode');
                    toggle.textContent = '[ ]';
                }

                    localStorage.setItem('theme', 'dark');

                } else {
