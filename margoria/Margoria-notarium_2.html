<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Margoria Notarium | Manuscript and Marginalia Studio</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="stylesheet" href="style.css" />

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets.js"></script>

</head>
<body class="theme-green">
  <header>
    <div class="header-left">
      <h1>Margoria Notarium</h1>
      <p>Manuscript and Marginalia Playground</p>
    </div>
    <div class="header-right">
      <button class="btn-tool" id="btn-toggle-theme" title="Switch Theme (Earth / Green)">
        <i data-lucide="palette"></i> Theme
      </button>
      <div class="dock-divider" style="height: 24px; margin: 0 5px;"></div>
      <button class="btn-tool" id="btn-clear">
        <i data-lucide="file-plus"></i> New
      </button>
      <button class="btn-tool primary" title="Save Codex (WIP)">
        <i data-lucide="save"></i> Save
      </button>
    </div>
  </header>

  <main>
    <!-- SCRIPTORIUM A (Left) -->
    <aside class="sidebar">
      <section>
        <h2><i data-lucide="type"></i> Decorative Letters</h2>
        <div id="grid-caps" class="asset-grid"></div>
      </section>

      <section>
        <h2><i data-lucide="pen-tool"></i> Text tools</h2>
        <div class="text-tools">
          <div class="asset-item" id="tool-add-text" title="Add text block">
            <i data-lucide="plus"></i>
          </div>
          <div class="asset-item" id="tool-cycle-text-color" title="Cycle ink color">
            <i data-lucide="droplet"></i>
          </div>
          <div class="asset-item" id="tool-clear-text-formatting" title="Clear all text formatting">
            <i data-lucide="type"></i>
          </div>
        </div>
      </section>
    </aside>

    <!-- CENTER CANVAS -->
    <section class="canvas-area">
      <div class="ruler-h"></div>
      <div class="ruler-v"></div>

      <div id="paper-viewport">
        <div class="demons-footer">
          <img src="images/layout/lildemonlt.png" alt="Little demon" />
          <img src="images/layout/pointingdemonlt.png" alt="Pointing demon" />
        </div>
        <div id="pivot-point"></div>
      </div>

  <!-- Context Toolbar -->
  
  <!-- CONTEXT TOOLBAR ESTRUCTURA -->
  <div id="context-toolbar" class="context-toolbar">
    <div id="border-repeat-section" class="toolbar-section" style="display: none;">
      <button class="toolbar-btn" id="btn-repeat-h"><i data-lucide="arrow-right"></i></button>
      <button class="toolbar-btn" id="btn-repeat-v"><i data-lucide="arrow-down"></i></button>
    </div>
      <div class="toolbar-section">
        <button class="toolbar-btn" id="btn-flip-h" title="Flip Horizontal"><i data-lucide="flip-horizontal"></i></button>
        <button class="toolbar-btn" id="btn-flip-v" title="Flip Vertical"><i data-lucide="flip-vertical"></i></button>
      </div>
    <div class="toolbar-section">
      <button class="toolbar-btn" id="btn-duplicate"><i data-lucide="copy"></i></button>
      <button class="toolbar-btn danger" id="btn-delete"><i data-lucide="trash-2"></i></button>
    </div>
  </div>

  <!-- TEXT TOOLBAR -->
      <div id="text-toolbar" class="text-toolbar">
        <div class="text-toolbar-group">
          <select id="text-font" class="toolbar-btn" style="padding: 4px 6px; border: 1px solid var(--accent-color); background: transparent; color: var(--text-main); font-size: 0.7rem; min-width: 80px;">
            <option value="capo1880">Capo 1880</option>
            <option value="pfeffermediaeval">Pfeffer Medieval</option>
            <option value="codexmanesse">Codex Manesse</option>
            <option value="cissanthemos">Cissanthemos</option>
            <option value="hicopus">Hoc Opus</option>
            <option value="icigist">Ici Gist</option>
            <option value="indiebusillis">Indie Busillis</option>
            <option value="litteraeignotae">Litterae Ignotae</option>
            <option value="malatemporacurrunt">Mala Tempora Currunt</option>
            <option value="pfeffersimpelgotisch">Pfeffer Simpel Gotisch</option>
            <option value="quariteregnumdei">Quaerite Regnum Dei</option>
            <option value="sprangalongobarda">Spranga Longobarda</option>
            <option value="vulnus">Vulnus</option>
            <option value="zifferaveneta">Ziffera Veneta</option>
            <option value="andiamoabruciarglilacasa">Andiamo A Bruciar Glilacasa</option>
            <option value="capoecclesia">Capo Ecclesia</option>
            <option value="capolinea">Capo Linea</option>
          </select>
        </div>
        <div class="text-toolbar-group">
          <button class="toolbar-btn" id="btn-text-bold" title="Bold"><i data-lucide="bold"></i></button>
          <button class="toolbar-btn" id="btn-text-italic" title="Italic"><i data-lucide="italic"></i></button>
          <button class="toolbar-btn" id="btn-text-underline" title="Underline"><i data-lucide="underline"></i></button>
        </div>
        <div class="text-toolbar-group">
          <button class="toolbar-btn" id="btn-text-align-left" title="Align Left"><i data-lucide="align-left"></i></button>
          <button class="toolbar-btn" id="btn-text-align-center" title="Align Center"><i data-lucide="align-center"></i></button>
          <button class="toolbar-btn" id="btn-text-align-right" title="Align Right"><i data-lucide="align-right"></i></button>
        </div>
        <div class="text-toolbar-group">
          <button class="toolbar-btn" id="btn-text-color" title="Text Color"><i data-lucide="droplet"></i></button>
          <input type="color" id="text-color-picker" style="width: 26px; height: 26px; border: 1px solid var(--accent-color); border-radius: 6px; cursor: pointer; padding: 0;">
        </div>
        <div class="text-toolbar-group">
          <input type="range" id="text-size-slider" class="toolbar-slider" min="12" max="72" step="2" value="26" style="width: 80px;">
          <span id="text-size-value" style="font-size: 0.65rem; color: var(--text-main); min-width: 35px; text-align: center;">26px</span>
        </div>
        <div class="text-toolbar-group">
          <button class="toolbar-btn" id="btn-text-duplicate" title="Duplicate Text"><i data-lucide="copy"></i></button>
          <button class="toolbar-btn danger" id="btn-text-delete" title="Delete Text"><i data-lucide="trash-2"></i></button>
        </div>
      </div>
      <div class="dock">
        <button id="bg-prev-btn"><i data-lucide="chevron-left"></i></button>
        <span id="bg-name">Loading background...</span>
        <button id="bg-next-btn"><i data-lucide="chevron-right"></i></button>
        <div class="dock-divider"></div>
        <button id="dock-add-text-btn">
          <i data-lucide="type"></i> Text block
        </button>
      </div>

      <!-- ZOOM CONTROL -->
      <div id="zoom-control">
        <span id="zoom-value">100%</span>
        <input type="range" id="zoom-slider" min="50" max="300" step="10" value="100">
      </div>
    </section>

    <!-- SCRIPTORIUM B (Right) -->
    <aside class="sidebar sidebar-right">
      <section>
        <h2><i data-lucide="frame"></i> Lines & Borders</h2>
        <div id="grid-borders" class="asset-grid"></div>
      </section>

      <section>
        <h2><i data-lucide="sparkles"></i> Marginalia</h2>
        <div id="grid-marginalias" class="asset-grid"></div>
      </section>
    </aside>
  </main>

  <script src="core.js"></script>
</body>
</html>
