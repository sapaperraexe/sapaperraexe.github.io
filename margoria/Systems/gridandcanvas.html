<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid & Export System Playground</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --panel-bg: rgba(26, 26, 26, 0.85);
            --accent: #8a8ad4;
            --accent-hover: #b0b0ff;
            --text: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: rgba(255, 255, 255, 0.1);
            --danger: #ff5555;
        }

        body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: var(--bg-dark);
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            color: var(--text);
        }

        /* --- WORKSPACE --- */
        #workspace-container {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        canvas#artboard { display: block; background: #ffffff; cursor: crosshair; }

        #grid-overlay, #guides-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; transition: opacity 0.2s;
        }
        #grid-overlay { z-index: 10; opacity: 0; }
        #guides-overlay { z-index: 11; opacity: 0; box-sizing: border-box; }

        .margin-box {
            position: absolute;
            border: 1px dashed var(--accent);
            background: rgba(138, 138, 212, 0.05);
            box-sizing: border-box;
        }
        
        .margin-label {
            position: absolute; top: -15px; left: 0;
            font-size: 9px; color: var(--accent);
            font-weight: bold; text-transform: uppercase;
        }

        /* --- UI PANEL --- */
        #ui-panel {
            position: fixed; top: 20px; right: 20px; width: 280px;
            background: var(--panel-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: 16px;
            padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            z-index: 100; max-height: 90vh; overflow-y: auto;
        }

        h2 { margin: 0 0 15px 0; font-size: 14px; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; justify-content: space-between;}
        h3 { margin: 15px 0 8px 0; font-size: 11px; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 4px; display: flex; align-items: center; justify-content: space-between; }

        .control-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        
        .margin-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 12px 8px;
            align-items: center;
        }
        
        .margin-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .margin-label-text {
            font-size: 8px;
            color: var(--text-muted);
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .input-with-icon {
            display: flex; align-items: center; gap: 6px;
            background: rgba(0,0,0,0.3); border-radius: 6px; padding: 4px 8px;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }
        .input-with-icon:hover { border-color: rgba(255,255,255,0.2); }
        .input-with-icon svg { 
            width: 14px; height: 14px; 
            opacity: 1; 
            fill: var(--accent); 
            flex-shrink: 0;
        }

        label { font-size: 11px; color: var(--text-muted); font-weight: 600; }

        input[type="number"], input[type="text"], select {
            background: transparent; border: none; color: var(--text);
            padding: 2px; font-size: 12px; width: 100%; box-sizing: border-box;
            font-family: monospace;
        }
        input:focus { outline: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* Color Picker Styling */
        input[type="color"] {
            -webkit-appearance: none; border: none; width: 24px; height: 24px; padding: 0;
            background: none; cursor: pointer; border-radius: 4px; overflow: hidden;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 4px; }

        .lock-btn {
            background: rgba(255,255,255,0.05); border: 1px solid transparent; 
            cursor: pointer; padding: 6px;
            display: flex; align-items: center; justify-content: center;
            opacity: 0.4; transition: 0.2s;
            border-radius: 6px;
            width: 28px; height: 28px;
            margin-top: 14px;
        }
        .lock-btn.active { opacity: 1; border-color: var(--accent); background: rgba(138, 138, 212, 0.1); }
        .lock-btn svg { width: 14px; height: 14px; fill: var(--accent); }

        .toggle-switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(16px); }

        button { background: rgba(138, 138, 212, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; width: 100%; transition: 0.2s; text-transform: uppercase; }
        button:hover { background: var(--accent); color: #fff; box-shadow: 0 0 15px var(--accent); }
        button.secondary { border-color: var(--border); color: var(--text-muted); background: transparent; }

        /* --- MODAL EXPORT --- */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 200; }
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--bg-dark); border: 1px solid var(--border); padding: 24px; border-radius: 16px; width: 340px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); }

        #doc-info { position: fixed; bottom: 20px; left: 20px; font-size: 10px; color: var(--text-muted); font-family: monospace; }
    </style>
</head>
<body>

    <div id="workspace-container">
        <canvas id="artboard" width="800" height="600"></canvas>
        <div id="grid-overlay"></div>
        <div id="guides-overlay"><div class="margin-box" id="marginBox"><span class="margin-label">Área Segura</span></div></div>
    </div>

    <div id="doc-info">800 x 600 px | Canvas Activo</div>

    <div id="ui-panel">
        <h2>Herramientas</h2>

        <h3>Sistema de Grid</h3>
        <div class="row">
            <label>Mostrar Grid</label>
            <label class="toggle-switch"><input type="checkbox" id="toggleGrid"><span class="slider"></span></label>
        </div>

        <div class="row" style="margin-top: 5px;">
            <label>Color Grid</label>
            <input type="color" id="gridColor" value="#8a8ad4">
        </div>
        
        <div class="control-group" style="margin-top: 10px;">
            <div class="row">
                <label>Tamaño (px)</label>
                <input type="number" id="gridSizeInput" value="50" min="10" max="200" class="scroll-input" style="width:60px; background:rgba(0,0,0,0.2); border:1px solid var(--border); border-radius:4px; padding:2px 5px;">
            </div>
            <input type="range" id="gridSizeSlider" min="10" max="200" value="50" style="accent-color: var(--accent);">
        </div>

        <div class="row">
            <label>Auto-Snap Guías</label>
            <label class="toggle-switch">
                <input type="checkbox" id="toggleSnap">
                <span class="slider"></span>
            </label>
        </div>

        <h3>Márgenes y Guías</h3>
        <div class="row">
            <label>Mostrar Guías</label>
            <label class="toggle-switch"><input type="checkbox" id="toggleGuides"><span class="slider"></span></label>
        </div>

        <div class="row" style="margin-top: 10px;">
            <label>Color Guía</label>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="color" id="guideColor" value="#8a8ad4">
                <input type="range" id="guideOpacity" min="0" max="100" value="50" style="width: 80px; accent-color: var(--accent);">
            </div>
        </div>

        <div class="margin-grid" style="margin-top: 15px;">
            <!-- Top -->
            <div class="margin-item">
                <span class="margin-label-text">TOP</span>
                <div class="input-with-icon">
                    <svg viewBox="0 0 24 24"><path d="M3 3h18v2H3V3zm5 4h8v2H8V7z"/></svg>
                    <input type="number" id="marginTop" value="40" class="scroll-input">
                </div>
            </div>
            <!-- Lock Vertical -->
            <button class="lock-btn active" id="lockVertical" title="Sincronizar Vertical">
                <svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2H8.9V6z"/></svg>
            </button>
            <!-- Bottom -->
            <div class="margin-item">
                <span class="margin-label-text">BOTTOM</span>
                <div class="input-with-icon">
                    <svg viewBox="0 0 24 24"><path d="M3 19h18v2H3v-2zm5-4h8v2H8v-2z"/></svg>
                    <input type="number" id="marginBottom" value="40" class="scroll-input">
                </div>
            </div>

            <!-- Left -->
            <div class="margin-item">
                <span class="margin-label-text">LEFT</span>
                <div class="input-with-icon">
                    <svg viewBox="0 0 24 24"><path d="M3 3h2v18H3V3zm4 5h2v8H7V8z"/></svg>
                    <input type="number" id="marginLeft" value="40" class="scroll-input">
                </div>
            </div>
            <!-- Lock Horizontal -->
            <button class="lock-btn active" id="lockHorizontal" title="Sincronizar Horizontal">
                <svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2H8.9V6z"/></svg>
            </button>
            <!-- Right -->
            <div class="margin-item">
                <span class="margin-label-text">RIGHT</span>
                <div class="input-with-icon">
                    <svg viewBox="0 0 24 24"><path d="M19 3h2v18h-2V3zm-4 5h2v8h-2V8z"/></svg>
                    <input type="number" id="marginRight" value="40" class="scroll-input">
                </div>
            </div>
        </div>

        <div style="margin-top: 30px; border-top: 1px solid var(--border); padding-top: 20px;">
            <button onclick="openExportModal()">Exportar Canvas</button>
        </div>
    </div>

    <!-- MODAL EXPORT -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal">
            <h2>Configurar Exportación</h2>
            <div class="control-group">
                <label>Nombre</label>
                <input type="text" id="expFilename" value="mi_diseño" style="background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:6px; padding:8px;">
            </div>

            <div class="control-group">
                <label>Resolución (px)</label>
                <div class="margin-grid" style="grid-template-columns: 1fr auto 1fr;">
                    <div class="margin-item">
                        <span class="margin-label-text">ANCHO</span>
                        <input type="number" id="expWidth" value="800" class="scroll-input" style="background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:6px; padding:8px;">
                    </div>
                    <button class="lock-btn active" id="lockExportRatio" style="width:30px; margin-top: 12px;">
                        <svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2 v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8.9 6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2H8.9V6z"/></svg>
                    </button>
                    <div class="margin-item">
                        <span class="margin-label-text">ALTO</span>
                        <input type="number" id="expHeight" value="600" class="scroll-input" style="background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:6px; padding:8px;">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Formato</label>
                <select id="expFormat" style="background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:6px; padding:8px;">
                    <option value="image/png">PNG</option>
                    <option value="image/jpeg">JPG</option>
                </select>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button onclick="processExport()">Descargar</button>
                <button class="secondary" onclick="closeExportModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('artboard');
        const ctx = canvas.getContext('2d');
        const gridOverlay = document.getElementById('grid-overlay');
        const guidesOverlay = document.getElementById('guides-overlay');
        const marginBox = document.getElementById('marginBox');
        
        const state = {
            grid: { visible: false, size: 50, color: '#8a8ad4' },
            guides: { 
                visible: false, 
                top: 40, right: 40, bottom: 40, left: 40,
                color: '#8a8ad4',
                opacity: 0.5
            },
            locks: { vertical: true, horizontal: true, export: true },
            aspectRatio: 800 / 600
        };

        function init() {
            drawMockContent();
            setupEventListeners();
            setupScrollInputs();
        }

        function setupEventListeners() {
            // Grid UI
            document.getElementById('toggleGrid').addEventListener('change', e => { state.grid.visible = e.target.checked; updateGrid(); });
            document.getElementById('gridColor').oninput = e => {
                state.grid.color = e.target.value;
                updateGrid();
            };
            document.getElementById('gridSizeSlider').addEventListener('input', e => { 
                state.grid.size = parseInt(e.target.value); 
                document.getElementById('gridSizeInput').value = state.grid.size; 
                updateGrid(); 
            });
            document.getElementById('gridSizeInput').addEventListener('input', e => { 
                state.grid.size = parseInt(e.target.value) || 10; 
                document.getElementById('gridSizeSlider').value = state.grid.size; 
                updateGrid(); 
            });

            // Locks
            document.getElementById('lockVertical').onclick = function() {
                this.classList.toggle('active');
                state.locks.vertical = this.classList.contains('active');
            };
            document.getElementById('lockHorizontal').onclick = function() {
                this.classList.toggle('active');
                state.locks.horizontal = this.classList.contains('active');
            };

            // Guide Appearance
            document.getElementById('guideColor').oninput = e => {
                state.guides.color = e.target.value;
                updateGuides();
            };
            document.getElementById('guideOpacity').oninput = e => {
                state.guides.opacity = e.target.value / 100;
                updateGuides();
            };

            // Margins Logic
            document.getElementById('marginTop').oninput = e => syncMargins('top', 'bottom', e.target.value, state.locks.vertical);
            document.getElementById('marginBottom').oninput = e => syncMargins('bottom', 'top', e.target.value, state.locks.vertical);
            document.getElementById('marginLeft').oninput = e => syncMargins('left', 'right', e.target.value, state.locks.horizontal);
            document.getElementById('marginRight').oninput = e => syncMargins('right', 'left', e.target.value, state.locks.horizontal);

            document.getElementById('toggleGuides').onchange = e => { state.guides.visible = e.target.checked; updateGuides(); };

            // Export Logic
            const expW = document.getElementById('expWidth');
            const expH = document.getElementById('expHeight');
            document.getElementById('lockExportRatio').onclick = function() {
                this.classList.toggle('active');
                state.locks.export = this.classList.contains('active');
            };

            expW.oninput = () => {
                if(state.locks.export) {
                    expH.value = Math.round(expW.value / state.aspectRatio);
                }
            };
            expH.oninput = () => {
                if(state.locks.export) {
                    expW.value = Math.round(expH.value * state.aspectRatio);
                }
            };
        }

        function setupScrollInputs() {
            const inputs = document.querySelectorAll('.scroll-input');
            inputs.forEach(input => {
                input.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const step = e.shiftKey ? 10 : 1; 
                    const direction = e.deltaY > 0 ? -step : step;
                    let newValue = (parseInt(input.value) || 0) + direction;
                    
                    if (input.id === 'gridSizeInput' && newValue < 10) newValue = 10;
                    if (newValue < 0) newValue = 0;
                    
                    input.value = newValue;
                    input.dispatchEvent(new Event('input'));
                }, { passive: false });
            });
        }

        function syncMargins(source, target, value, isLocked) {
            state.guides[source] = parseInt(value) || 0;
            if (isLocked) {
                state.guides[target] = state.guides[source];
                document.getElementById(`margin${target.charAt(0).toUpperCase() + target.slice(1)}`).value = value;
            }
            updateGuides();
        }

        function updateGrid() {
            gridOverlay.style.opacity = state.grid.visible ? '1' : '0';
            if (state.grid.visible) {
                const size = state.grid.size;
                const rgb = hexToRgb(state.grid.color);
                gridOverlay.style.backgroundSize = `${size}px ${size}px`;
                gridOverlay.style.backgroundImage = `linear-gradient(to right, rgba(${rgb}, 0.2) 1px, transparent 1px), linear-gradient(to bottom, rgba(${rgb}, 0.2) 1px, transparent 1px)`;
            }
        }

        function updateGuides() {
            guidesOverlay.style.opacity = state.guides.visible ? '1' : '0';
            if (state.guides.visible) {
                marginBox.style.top = `${state.guides.top}px`;
                marginBox.style.bottom = `${state.guides.bottom}px`;
                marginBox.style.left = `${state.guides.left}px`;
                marginBox.style.right = `${state.guides.right}px`;
                marginBox.style.borderColor = state.guides.color;
                marginBox.style.background = `rgba(${hexToRgb(state.guides.color)}, ${state.guides.opacity * 0.2})`;
                marginBox.style.opacity = state.guides.opacity;
                
                const label = marginBox.querySelector('.margin-label');
                if(label) label.style.color = state.guides.color;
            }
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }

        function drawMockContent() {
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#8a8ad4'; ctx.beginPath(); ctx.arc(400, 300, 100, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#333'; ctx.font = '24px Arial'; ctx.fillText("Contenido del Canvas", 280, 450);
        }

        function openExportModal() { document.getElementById('exportModal').style.display = 'block'; }
        function closeExportModal() { document.getElementById('exportModal').style.display = 'none'; }

        function processExport() {
            const w = parseInt(document.getElementById('expWidth').value);
            const h = parseInt(document.getElementById('expHeight').value);
            const format = document.getElementById('expFormat').value;
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w; tempCanvas.height = h;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(canvas, 0, 0, w, h);
            
            const link = document.createElement('a');
            link.download = document.getElementById('expFilename').value + (format === 'image/png' ? '.png' : '.jpg');
            link.href = tempCanvas.toDataURL(format);
            link.click();
            closeExportModal();
        }

        init();
    </script>
</body>
</html>
