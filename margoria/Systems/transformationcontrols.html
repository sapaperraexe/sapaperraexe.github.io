<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformación con Pivot Dinámico Real</title>
    <style>
        :root {
            --primary: #006eff;
            --handle-size: 10px;
            --bg-color: #0f0f0f;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Consolas', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas {
            width: 100%;
            height: 100%;
            position: relative;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            cursor: crosshair;
        }

        .transform-box {
            position: absolute;
            top: 0; left: 0;
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
            will-change: transform, width, height;
            transform-origin: 0 0; 
        }

        .content {
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1614850523296-e811cfbaf163?q=80&w=2070&auto=format&fit=crop') no-repeat center/cover;
            border: 1px solid var(--primary);
            cursor: move;
        }

        .handle {
            position: absolute;
            width: var(--handle-size);
            height: var(--handle-size);
            background: white;
            border: 1px solid var(--primary);
            z-index: 10;
            transform: translate(-50%, -50%);
        }

        .h-nw { top: 0%; left: 0%; }
        .h-n  { top: 0%; left: 50%; }
        .h-ne { top: 0%; left: 100%; }
        .h-e  { top: 50%; left: 100%; }
        .h-se { top: 100%; left: 100%; }
        .h-s  { top: 100%; left: 50%; }
        .h-sw { top: 100%; left: 0%; }
        .h-w  { top: 50%; left: 0%; }

        .h-rot {
            top: -40px; left: 50%;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid white;
        }

        .h-rot-line {
            position: absolute;
            top: -40px; left: 50%;
            height: 40px; width: 1px;
            background: var(--primary);
            transform: translateX(-50%);
            pointer-events: none;
        }

        #pivot-point {
            position: absolute;
            width: 14px; height: 14px;
            border: 2px solid #00ff00;
            border-radius: 50%;
            pointer-events: auto;
            z-index: 100;
            transform: translate(-50%, -50%);
            cursor: pointer;
        }
        
        #pivot-point::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: #00ff00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .ui-panel {
            position: fixed;
            bottom: 20px; left: 20px;
            color: #00ff00;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border: 1px solid #00ff00;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="canvas">
    <div id="pivot-point" title="Doble clic para centrar pivot"></div>
    <div class="transform-box" id="box" style="transform: translate(300px, 200px) rotate(0deg); width: 350px; height: 250px;">
        <div class="content" id="box-content"></div>
        <div class="h-rot-line"></div>
        <div class="handle h-nw" data-dir="nw"></div>
        <div class="handle h-n"  data-dir="n"></div>
        <div class="handle h-ne" data-dir="ne"></div>
        <div class="handle h-e"  data-dir="e"></div>
        <div class="handle h-se" data-dir="se"></div>
        <div class="handle h-s"  data-dir="s"></div>
        <div class="handle h-sw" data-dir="sw"></div>
        <div class="handle h-w"  data-dir="w"></div>
        <div class="handle h-rot" data-dir="rot"></div>
    </div>
</div>

<div class="ui-panel">
    <div id="debug">SISTEMA OK</div>
    <div style="margin-top:8px">
        [Alt + Click en Handle] -> Mover Pivot local<br>
        [Doble Click en Pivot] -> Resetear al Centro<br>
        Rotación: Ahora respeta el pivot verde seleccionado
    </div>
</div>

<script>
    class TechnicalTransformer {
        constructor(id) {
            this.el = document.getElementById(id);
            this.pivotEl = document.getElementById('pivot-point');
            this.state = {
                x: 300, y: 200, w: 350, h: 250, angle: 0,
                pivotLocal: { x: 0.5, y: 0.5 },
                isDragging: false,
                type: null,
                handle: null
            };
            this.keys = { alt: false, shift: false };
            this.init();
        }

        init() {
            this.el.querySelectorAll('.handle').forEach(h => {
                h.addEventListener('mousedown', e => {
                    if (e.altKey) {
                        this.setPivotFromHandle(h.dataset.dir);
                    } else {
                        this.onStart(e, h.dataset.dir);
                    }
                });
            });

            const content = this.el.querySelector('.content');
            content.addEventListener('mousedown', e => this.onStart(e, 'move'));
            
            this.pivotEl.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                this.resetPivot();
            });

            window.addEventListener('mousemove', e => this.onMove(e));
            window.addEventListener('mouseup', () => this.onEnd());
            window.addEventListener('keydown', e => this.onKey(e, true));
            window.addEventListener('keyup', e => this.onKey(e, false));
            
            this.updateCursors();
            this.render();
        }

        onKey(e, pressed) {
            this.keys.alt = e.altKey;
            this.keys.shift = e.shiftKey;
        }

        resetPivot() {
            this.state.pivotLocal = { x: 0.5, y: 0.5 };
            this.render();
        }

        setPivotFromHandle(dir) {
            const map = {
                nw: [0, 0], n: [0.5, 0], ne: [1, 0],
                e: [1, 0.5], se: [1, 1], s: [0.5, 1],
                sw: [0, 1], w: [0, 0.5], rot: [0.5, 0.5]
            };
            const [px, py] = map[dir] || [0.5, 0.5];
            this.state.pivotLocal = { x: px, y: py };
            this.render();
        }

        getGlobalPoint(lx, ly, current = this.state) {
            const rad = current.angle * Math.PI / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);
            return {
                x: current.x + (lx * current.w * cos - ly * current.h * sin),
                y: current.y + (lx * current.w * sin + ly * current.h * cos)
            };
        }

        onStart(e, type) {
            e.stopPropagation();
            e.preventDefault();
            this.state.isDragging = true;
            this.state.type = type === 'rot' ? 'rotate' : (type === 'move' ? 'move' : 'resize');
            this.state.handle = type;
            this.snap = { ...this.state, mx: e.clientX, my: e.clientY };
            
            // Punto de anclaje global (donde el objeto no debe moverse)
            this.anchorGlobal = this.getGlobalPoint(this.state.pivotLocal.x, this.state.pivotLocal.y);
            
            if (this.state.type === 'rotate') {
                const dx = e.clientX - this.anchorGlobal.x;
                const dy = e.clientY - this.anchorGlobal.y;
                // Ángulo inicial entre el mouse y el pivot
                this.initialMouseAngle = Math.atan2(dy, dx) * 180 / Math.PI;
                this.initialObjectAngle = this.state.angle;
            }
        }

        onMove(e) {
            if (!this.state.isDragging) return;

            if (this.state.type === 'move') {
                this.state.x = this.snap.x + (e.clientX - this.snap.mx);
                this.state.y = this.snap.y + (e.clientY - this.snap.my);
            } else if (this.state.type === 'rotate') {
                const dx = e.clientX - this.anchorGlobal.x;
                const dy = e.clientY - this.anchorGlobal.y;
                const currentMouseAngle = Math.atan2(dy, dx) * 180 / Math.PI;
                const deltaAngle = currentMouseAngle - this.initialMouseAngle;
                
                this.state.angle = this.initialObjectAngle + deltaAngle;

                // Corregir X e Y para que el pivot global se mantenga en anchorGlobal
                const rad = this.state.angle * Math.PI / 180;
                this.state.x = this.anchorGlobal.x - (this.state.pivotLocal.x * this.state.w * Math.cos(rad) - this.state.pivotLocal.y * this.state.h * Math.sin(rad));
                this.state.y = this.anchorGlobal.y - (this.state.pivotLocal.x * this.state.w * Math.sin(rad) + this.state.pivotLocal.y * this.state.h * Math.cos(rad));
                
                this.updateCursors();
            } else {
                this.handleResize(e.clientX, e.clientY);
            }
            this.render();
        }

        handleResize(mx, my) {
            const dx = mx - this.snap.mx;
            const dy = my - this.snap.my;
            const rad = -this.snap.angle * Math.PI / 180;
            const lx = dx * Math.cos(rad) - dy * Math.sin(rad);
            const ly = dx * Math.sin(rad) + dy * Math.cos(rad);
            
            const h = this.state.handle;
            const sx = h.includes('e') ? 1 : (h.includes('w') ? -1 : 0);
            const sy = h.includes('s') ? 1 : (h.includes('n') ? -1 : 0);
            
            const distXP = h.includes('e') ? (1 - this.state.pivotLocal.x) : (h.includes('w') ? this.state.pivotLocal.x : 0);
            const distYP = h.includes('s') ? (1 - this.state.pivotLocal.y) : (h.includes('n') ? this.state.pivotLocal.y : 0);
            
            let dw = distXP > 0 ? (lx * sx / distXP) : 0;
            let dh = distYP > 0 ? (ly * sy / distYP) : 0;
            
            if (!this.keys.shift && (h.length === 2)) {
                const ratio = this.snap.w / this.snap.h;
                if (Math.abs(dw) > Math.abs(dh * ratio)) dh = dw / ratio;
                else dw = dh * ratio;
            }
            
            const nw = Math.max(10, this.snap.w + dw);
            const nh = Math.max(10, this.snap.h + dh);
            
            this.state.w = nw;
            this.state.h = nh;
            
            const nRad = this.state.angle * Math.PI / 180;
            this.state.x = this.anchorGlobal.x - (this.state.pivotLocal.x * nw * Math.cos(nRad) - this.state.pivotLocal.y * nh * Math.sin(nRad));
            this.state.y = this.anchorGlobal.y - (this.state.pivotLocal.x * nw * Math.sin(nRad) + this.state.pivotLocal.y * nh * Math.cos(nRad));
        }

        updateCursors() {
            const a = ((this.state.angle % 360) + 360) % 360;
            const hList = ['n', 'ne', 'e', 'se', 's', 'sw', 'w', 'nw'];
            const rCursors = ['ns-resize', 'nesw-resize', 'ew-resize', 'nwse-resize'];
            
            const svgIcon = `<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8'/><path d='M21 3v5h-5'/></svg>`;
            const rotCursor = `url("data:image/svg+xml;base64,${btoa(svgIcon)}") 16 16, auto`;

            hList.forEach((h, i) => {
                const el = this.el.querySelector(`[data-dir="${h}"]`);
                const idx = Math.round((i * 45 + a) / 45) % 8;
                el.style.cursor = rCursors[idx % 4];
            });

            const rotHandle = this.el.querySelector('[data-dir="rot"]');
            rotHandle.style.cursor = rotCursor;
        }

        onEnd() {
            this.state.isDragging = false;
        }

        render() {
            const { x, y, w, h, angle, pivotLocal } = this.state;
            this.el.style.width = `${w}px`;
            this.el.style.height = `${h}px`;
            this.el.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
            
            const gPivot = this.getGlobalPoint(pivotLocal.x, pivotLocal.y);
            this.pivotEl.style.left = gPivot.x + 'px';
            this.pivotEl.style.top = gPivot.y + 'px';
            
            document.getElementById('debug').innerHTML = `PIVOT LOCAL: ${pivotLocal.x.toFixed(2)},${pivotLocal.y.toFixed(2)} | ANG: ${Math.round(angle)}°`;
        }
    }

    new TechnicalTransformer('box');
</script>
</body>
</html>
