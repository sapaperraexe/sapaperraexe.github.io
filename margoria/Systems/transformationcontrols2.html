<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformación Multi-Elemento con Pivot Dinámico</title>
    <style>
        :root {
            --primary: #006eff;
            --handle-size: 10px;
            --bg-color: #0f0f0f;
            --text-accent: #00ff00;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Consolas', monospace;
        }

        #canvas {
            width: 100%;
            height: 100%;
            position: relative;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            cursor: crosshair;
        }

        .transform-box {
            position: absolute;
            top: 0; left: 0;
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
            will-change: transform, width, height;
            transform-origin: 0 0; 
            z-index: 1;
        }

        .transform-box.active {
            z-index: 10;
        }

        .content {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(0, 110, 255, 0.3);
            cursor: move;
            transition: border-color 0.2s;
            overflow: hidden;
        }

        .active .content {
            border: 1px solid var(--primary);
            box-shadow: 0 0 20px rgba(0, 110, 255, 0.2);
        }

        .text-content {
            padding: 15px;
            color: var(--text-accent);
            background: rgba(0, 255, 0, 0.05);
            font-size: 18px;
            line-height: 1.2;
            outline: none;
            word-break: break-word;
            height: 100%;
            box-sizing: border-box;
        }

        .handle {
            position: absolute;
            width: var(--handle-size);
            height: var(--handle-size);
            background: white;
            border: 1px solid var(--primary);
            z-index: 20;
            transform: translate(-50%, -50%);
            display: none;
        }

        .active .handle {
            display: block;
        }

        .h-nw { top: 0%; left: 0%; }
        .h-n  { top: 0%; left: 50%; }
        .h-ne { top: 0%; left: 100%; }
        .h-e  { top: 50%; left: 100%; }
        .h-se { top: 100%; left: 100%; }
        .h-s  { top: 100%; left: 50%; }
        .h-sw { top: 100%; left: 0%; }
        .h-w  { top: 50%; left: 0%; }

        .h-rot {
            top: -40px; left: 50%;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid white;
        }

        .h-rot-line {
            position: absolute;
            top: -40px; left: 50%;
            height: 40px; width: 1px;
            background: var(--primary);
            transform: translateX(-50%);
            pointer-events: none;
            display: none;
        }

        .active .h-rot-line {
            display: block;
        }

        #pivot-point {
            position: absolute;
            width: 14px; height: 14px;
            border: 2px solid #00ff00;
            border-radius: 50%;
            pointer-events: auto;
            z-index: 100;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            display: none;
        }
        
        #pivot-point.visible {
            display: block;
        }

        #pivot-point::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: #00ff00;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .ui-panel {
            position: fixed;
            bottom: 20px; left: 20px;
            color: #00ff00;
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border: 1px solid #00ff00;
            font-size: 11px;
            pointer-events: none;
            border-radius: 4px;
            backdrop-filter: blur(4px);
            z-index: 1000;
        }
    </style>
</head>
<body>

<div id="canvas">
    <div id="pivot-point"></div>
    
    <div class="transform-box" id="box1" style="width: 300px; height: 200px;">
        <div class="content" style="background: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop') no-repeat center/cover;"></div>
        <div class="h-rot-line"></div>
        <div class="handle h-nw" data-dir="nw"></div>
        <div class="handle h-n"  data-dir="n"></div>
        <div class="handle h-ne" data-dir="ne"></div>
        <div class="handle h-e"  data-dir="e"></div>
        <div class="handle h-se" data-dir="se"></div>
        <div class="handle h-s"  data-dir="s"></div>
        <div class="handle h-sw" data-dir="sw"></div>
        <div class="handle h-w"  data-dir="w"></div>
        <div class="handle h-rot" data-dir="rot"></div>
    </div>

    <div class="transform-box" id="box2" style="width: 250px; height: 350px;">
        <div class="content" style="background: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop') no-repeat center/cover;"></div>
        <div class="h-rot-line"></div>
        <div class="handle h-nw" data-dir="nw"></div>
        <div class="handle h-n"  data-dir="n"></div>
        <div class="handle h-ne" data-dir="ne"></div>
        <div class="handle h-e"  data-dir="e"></div>
        <div class="handle h-se" data-dir="se"></div>
        <div class="handle h-s"  data-dir="s"></div>
        <div class="handle h-sw" data-dir="sw"></div>
        <div class="handle h-w"  data-dir="w"></div>
        <div class="handle h-rot" data-dir="rot"></div>
    </div>

    <div class="transform-box" id="box3" style="width: 400px; height: 150px;">
        <div class="content">
            <div class="text-content" contenteditable="true" spellcheck="false">
                > PROTOCOLO: INICIADO<br>
                > ESTADO: TRANSFORMABLE<br>
                > EDITAR TEXTO AQUÍ...
            </div>
        </div>
        <div class="h-rot-line"></div>
        <div class="handle h-nw" data-dir="nw"></div>
        <div class="handle h-n"  data-dir="n"></div>
        <div class="handle h-ne" data-dir="ne"></div>
        <div class="handle h-e"  data-dir="e"></div>
        <div class="handle h-se" data-dir="se"></div>
        <div class="handle h-s"  data-dir="s"></div>
        <div class="handle h-sw" data-dir="sw"></div>
        <div class="handle h-w"  data-dir="w"></div>
        <div class="handle h-rot" data-dir="rot"></div>
    </div>
</div>

<div class="ui-panel">
    <div id="debug">SELECCIONE ELEMENTO</div>
    <div style="margin-top:8px; line-height: 1.4; opacity: 0.8;">
        [Click] -> Seleccionar / [Ctrl + Click] -> Multi-selección<br>
        [Alt + Click en Handle] -> Mover Pivot local<br>
        [Doble Click en Pivot] -> Resetear Pivot<br>
        [Shift] -> Mantener Proporción
    </div>
</div>

<script>
    class TechnicalTransformer {
        constructor(el, manager) {
            this.el = el;
            this.manager = manager;
            this.pivotEl = document.getElementById('pivot-point');
            
            const startX = 50 + Math.random() * 200;
            const startY = 50 + Math.random() * 200;
            
            this.state = {
                x: startX, y: startY, 
                w: parseFloat(el.style.width), 
                h: parseFloat(el.style.height), 
                angle: 0,
                pivotLocal: { x: 0.5, y: 0.5 }
            };
            
            this.init();
        }

        init() {
            this.el.querySelectorAll('.handle').forEach(h => {
                h.addEventListener('mousedown', e => {
                    if (!this.manager.selection.has(this)) return;
                    if (e.altKey) {
                        this.setPivotFromHandle(h.dataset.dir);
                    } else {
                        this.manager.onStart(e, h.dataset.dir);
                    }
                });
            });

            const content = this.el.querySelector('.content');
            content.addEventListener('mousedown', e => {
                if (e.target.getAttribute('contenteditable') === 'true' && document.activeElement === e.target) return; 
                
                if (e.ctrlKey) {
                    this.manager.toggleSelection(this);
                } else if (!this.manager.selection.has(this)) {
                    this.manager.clearSelection();
                    this.manager.toggleSelection(this);
                }
                
                this.manager.onStart(e, 'move');
            });
            
            this.render();
        }

        setPivotFromHandle(dir) {
            const map = {
                nw: [0, 0], n: [0.5, 0], ne: [1, 0],
                e: [1, 0.5], se: [1, 1], s: [0.5, 1],
                sw: [0, 1], w: [0, 0.5], rot: [0.5, 0.5]
            };
            const [px, py] = map[dir] || [0.5, 0.5];
            this.state.pivotLocal = { x: px, y: py };
            this.render();
        }

        getGlobalPoint(lx, ly) {
            const rad = this.state.angle * Math.PI / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);
            return {
                x: this.state.x + (lx * this.state.w * cos - ly * this.state.h * sin),
                y: this.state.y + (lx * this.state.w * sin + ly * this.state.h * cos)
            };
        }

        render() {
            const { x, y, w, h, angle, pivotLocal } = this.state;
            this.el.style.width = `${w}px`;
            this.el.style.height = `${h}px`;
            this.el.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
            this.updateCursors();
        }

        updateCursors() {
            const a = ((this.state.angle % 360) + 360) % 360;
            const hList = ['n', 'ne', 'e', 'se', 's', 'sw', 'w', 'nw'];
            const rCursors = ['ns-resize', 'nesw-resize', 'ew-resize', 'nwse-resize'];
            hList.forEach((h, i) => {
                const el = this.el.querySelector(`[data-dir="${h}"]`);
                if (el) {
                    const idx = Math.round((i * 45 + a) / 45) % 8;
                    el.style.cursor = rCursors[idx % 4];
                }
            });
        }
    }

    class TransformManager {
        constructor() {
            this.items = [];
            this.selection = new Set();
            this.isDragging = false;
            this.keys = { shift: false, ctrl: false };
            this.pivotEl = document.getElementById('pivot-point');
            this.init();
        }

        init() {
            document.querySelectorAll('.transform-box').forEach(el => {
                this.items.push(new TechnicalTransformer(el, this));
            });

            window.addEventListener('mousemove', e => this.onMove(e));
            window.addEventListener('mouseup', () => this.isDragging = false);
            window.addEventListener('keydown', e => { 
                this.keys.shift = e.shiftKey; 
                this.keys.ctrl = e.ctrlKey || e.metaKey;
            });
            window.addEventListener('keyup', e => { 
                this.keys.shift = e.shiftKey;
                this.keys.ctrl = e.ctrlKey || e.metaKey;
            });

            this.pivotEl.addEventListener('dblclick', () => {
                this.selection.forEach(item => {
                    item.state.pivotLocal = { x: 0.5, y: 0.5 };
                    item.render();
                });
                this.updatePivotUI();
            });

            document.getElementById('canvas').addEventListener('mousedown', e => {
                if (e.target.id === 'canvas') this.clearSelection();
            });
        }

        toggleSelection(item) {
            if (this.selection.has(item)) {
                this.selection.delete(item);
                item.el.classList.remove('active');
            } else {
                this.selection.add(item);
                item.el.classList.add('active');
            }
            this.updatePivotUI();
        }

        clearSelection() {
            this.selection.forEach(item => item.el.classList.remove('active'));
            this.selection.clear();
            this.updatePivotUI();
        }

        updatePivotUI() {
            if (this.selection.size === 0) {
                this.pivotEl.classList.remove('visible');
                document.getElementById('debug').innerHTML = 'SELECCIONE ELEMENTO';
                return;
            }
            this.pivotEl.classList.add('visible');
            
            let gPivot;
            if (this.selection.size === 1) {
                const it = this.selection.values().next().value;
                gPivot = it.getGlobalPoint(it.state.pivotLocal.x, it.state.pivotLocal.y);
                document.getElementById('debug').innerHTML = `SINGLE: ${it.el.id} | ${Math.round(it.state.angle)}°`;
            } else {
                let tx = 0, ty = 0;
                this.selection.forEach(it => {
                    const p = it.getGlobalPoint(it.state.pivotLocal.x, it.state.pivotLocal.y);
                    tx += p.x; ty += p.y;
                });
                gPivot = { x: tx / this.selection.size, y: ty / this.selection.size };
                document.getElementById('debug').innerHTML = `GRUPO: ${this.selection.size} ELEMENTOS`;
            }
            this.pivotEl.style.left = gPivot.x + 'px';
            this.pivotEl.style.top = gPivot.y + 'px';
        }

        onStart(e, handleType) {
            e.stopPropagation();
            if (handleType !== 'move') e.preventDefault();
            
            this.isDragging = true;
            this.handle = handleType;
            this.dragType = handleType === 'rot' ? 'rotate' : (handleType === 'move' ? 'move' : 'resize');
            
            const rect = this.pivotEl.getBoundingClientRect();
            this.anchorGlobal = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
            this.mouseStart = { x: e.clientX, y: e.clientY };

            this.snapStates = new Map();
            this.selection.forEach(it => {
                this.snapStates.set(it, { ...it.state });
            });

            if (this.dragType === 'rotate') {
                this.initialMouseAngle = Math.atan2(e.clientY - this.anchorGlobal.y, e.clientX - this.anchorGlobal.x) * 180 / Math.PI;
            }
        }

        onMove(e) {
            if (!this.isDragging) return;

            this.selection.forEach(it => {
                const snap = this.snapStates.get(it);
                
                if (this.dragType === 'move') {
                    it.state.x = snap.x + (e.clientX - this.mouseStart.x);
                    it.state.y = snap.y + (e.clientY - this.mouseStart.y);
                } 
                else if (this.dragType === 'rotate') {
                    const currentMouseAngle = Math.atan2(e.clientY - this.anchorGlobal.y, e.clientX - this.anchorGlobal.x) * 180 / Math.PI;
                    const deltaAngle = currentMouseAngle - this.initialMouseAngle;
                    
                    it.state.angle = snap.angle + deltaAngle;
                    const rad = deltaAngle * Math.PI / 180;
                    const cos = Math.cos(rad), sin = Math.sin(rad);
                    
                    const itPivot = it.getGlobalPoint(it.state.pivotLocal.x, it.state.pivotLocal.y);
                    const rx = snap.x - this.anchorGlobal.x;
                    const ry = snap.y - this.anchorGlobal.y;
                    
                    it.state.x = this.anchorGlobal.x + (rx * cos - ry * sin);
                    it.state.y = this.anchorGlobal.y + (rx * sin + ry * cos);
                }
                else if (this.dragType === 'resize') {
                    this.applyResize(it, snap, e.clientX, e.clientY);
                }
                it.render();
            });
            this.updatePivotUI();
        }

        applyResize(it, snap, mx, my) {
            const dx = mx - this.mouseStart.x;
            const dy = my - this.mouseStart.y;
            
            const rad = -snap.angle * Math.PI / 180;
            const lx = dx * Math.cos(rad) - dy * Math.sin(rad);
            const ly = dx * Math.sin(rad) + dy * Math.cos(rad);
            
            const h = this.handle;
            const sx = h.includes('e') ? 1 : (h.includes('w') ? -1 : 0);
            const sy = h.includes('s') ? 1 : (h.includes('n') ? -1 : 0);
            
            const distXP = h.includes('e') ? (1 - it.state.pivotLocal.x) : (h.includes('w') ? it.state.pivotLocal.x : 0);
            const distYP = h.includes('s') ? (1 - it.state.pivotLocal.y) : (h.includes('n') ? it.state.pivotLocal.y : 0);
            
            let dw = distXP > 0 ? (lx * sx / distXP) : 0;
            let dh = distYP > 0 ? (ly * sy / distYP) : 0;
            
            if (!this.keys.shift && h.length === 2) {
                const ratio = snap.w / snap.h;
                if (Math.abs(dw) > Math.abs(dh * ratio)) dh = dw / ratio;
                else dw = dh * ratio;
            }
            
            const nw = Math.max(10, snap.w + dw);
            const nh = Math.max(10, snap.h + dh);
            
            it.state.w = nw;
            it.state.h = nh;
            
            const nRad = it.state.angle * Math.PI / 180;
            const anchor = it.getGlobalPoint(it.state.pivotLocal.x, it.state.pivotLocal.y);
            it.state.x = anchor.x - (it.state.pivotLocal.x * nw * Math.cos(nRad) - it.state.pivotLocal.y * nh * Math.sin(nRad));
            it.state.y = anchor.y - (it.state.pivotLocal.x * nw * Math.sin(nRad) + it.state.pivotLocal.y * nh * Math.cos(nRad));
        }
    }

    new TransformManager();
</script>
</body>
</html>
