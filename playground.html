<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapaperra.exe - Playground</title>
    <style>
        :root {
            --panel-bg: rgba(26, 26, 26, 0.95);
            --border: rgba(192, 192, 192, 0.15);
            --accent: #8a8ad4;
            --blur: blur(12px);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --text-color: #c0c0c0;
            --bg-dark: #121212;
        }

        body {
            background-color: var(--bg-dark);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            font-family: "Courier New", Courier, monospace;
        }

        /* Dock en Playground */
        #dock-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
        }

        #dock {
            background: var(--panel-bg);
            backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            transition: var(--transition);
        }

        .dock-item {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .dock-item svg {
            width: 22px;
            height: 22px;
            fill: var(--text-color);
        }

        .dock-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(3px);
        }

        .dock-item.active {
            background: rgba(138, 138, 212, 0.2);
            border: 1px solid var(--accent);
        }

        .dock-item.active svg { fill: var(--accent); }

        .dock-item::after {
            content: attr(data-label);
            position: absolute;
            top: 60px;
            background: var(--panel-bg);
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 10px;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            white-space: nowrap;
            border: 1px solid var(--border);
        }

        .dock-item:hover::after { opacity: 1; top: 55px; }

        /* Separador */
        .separator {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 5px;
        }

        /* Viewport */
        #viewport {
            width: 100%;
            height: 100vh;
            border: none;
            padding-top: 80px;
            box-sizing: border-box;
        }

        #empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0.3;
        }
    </style>
</head>
<body>

<div id="dock-container">
    <div id="dock">
        <!-- Botón de Atrás -->
        <div class="dock-item" onclick="location.href='index.html'" data-label="VOLVER AL INICIO">
            <svg viewBox="0 0 24 24"><path d="M20,11H7.83l5.59-5.59L12,4l-8,8l8,8l1.41-1.41L7.83,13H20V11z"/></svg>
        </div>

        <div class="separator"></div>

        <!-- Módulos -->
        <div class="dock-item module-btn" data-module="continuum" data-url="https://sapaperraexe.github.io/continuum.html" data-label="Continuum Inspector">
            <svg viewBox="0 0 24 24"><path d="M21,16.5L12.57,21.82C12.41,21.94 12.21,22 12,22C11.79,22 11.59,21.94 11.43,21.82L3.53,17.38C3.21,17.21 3,16.88 3,16.5V7.5L11.43,2.18C11.59,2.06 11.79,2 12,2L20.47,6.62C20.79,6.79 21,7.12 21,7.5V16.5Z" /></svg>
        </div>
        
        <div class="dock-item module-btn" data-module="infinity" data-url="about:blank" data-label="Infinity Engine">
            <svg viewBox="0 0 24 24"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg>
        </div>
    </div>
</div>

<div id="empty-state">
    <p>SELECCIONE UN MÓDULO PARA COMENZAR</p>
</div>

<iframe id="viewport" src="about:blank"></iframe>

<script>
    (function() {
        const buttons = document.querySelectorAll('.module-btn');
        const iframe = document.getElementById('viewport');
        const emptyState = document.getElementById('empty-state');

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                const url = btn.dataset.url;
                
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                emptyState.style.display = 'none';
                iframe.src = url;
            });
        });

        // Verificar si viene una app por URL
        const params = new URLSearchParams(window.location.search);
        const app = params.get('app');
        if (app) {
            const targetBtn = document.querySelector(`[data-module="${app}"]`);
            if (targetBtn) targetBtn.click();
        }
    })();
</script>
</body>
</html>
