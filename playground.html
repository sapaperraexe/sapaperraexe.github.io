<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapaperra.exe - Playground</title>
    <style>
        :root {
            --bg-dark: #121212;
            --text-color: #c0c0c0;
        }

        body {
            background-color: var(--bg-dark);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            font-family: "Courier New", Courier, monospace;
        }

       /* Override Dock Position for Playground */
        /* Moving it to Top-Right to avoid UI conflicts */
        sapaperra-dock {
            top: 20px !important;
            right: 20px !important;
            left: auto !important; /* Clear the default centering */
            transform: none !important;
        }
        /* Viewport - The actual window where things load */
        #viewport {
            width: 100%;
            height: 100vh;
            border: none;
            display: none; /* Hidden until something loads */
        }

        /* Empty State - What you see before clicking anything */
        #empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-color);
            opacity: 0.3;
            pointer-events: none;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: normal;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <!-- The Dock Component -->
    <sapaperra-dock playground></sapaperra-dock>

    <!-- Empty State Message -->
    <div id="empty-state">
        <h1>READY FOR INPUT</h1>
        <p>Select a module from the dock</p>
    </div>

    <!-- The Viewport Iframe -->
    <iframe id="viewport" title="Module Viewport"></iframe>

    <!-- 1. Load the Component Logic -->
    <script src="sapaperraexe-dock.js"></script>

    <!-- 2. Handle the Events (Separated so it actually runs) -->
    <script>
        window.addEventListener('module-change', (e) => {
            const { url } = e.detail;
            const iframe = document.getElementById('viewport');
            const emptyState = document.getElementById('empty-state');

            if (iframe && url) {
                iframe.src = url;
                if (emptyState) emptyState.style.display = 'none';
                iframe.style.display = 'block';
            }
        });
    </script>

</body>
</html>
